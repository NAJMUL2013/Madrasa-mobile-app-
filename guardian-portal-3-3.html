<title>অভিভাবক পোর্টাল — বোররচর কাচারী বাজার ইসলামিয়া হুসাইনিয়া মাদরাসা</title>

<style>
  :root{
    --bg:#FBF7EE; --card:#FFFFFF; --sage:#EEF2E8; --green:#14432A; --greenDeep:#0D3320;
    --gold:#C89B3C; --ink:#22281F; --inkSoft:#5B6357; --due:#B3441E; --paid:#3D7A4E; --border:#E2DCC8;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--greenDeep),var(--green));
    font-family:'Hind Siliguri','Nirmala UI',Arial,sans-serif;color:var(--ink);
    display:flex;align-items:center;justify-content:center;padding:20px;}
  h1,h2{font-family:'Noto Serif Bengali','Nirmala UI',serif;}
  .wrap{width:100%;max-width:420px;}
  .card{background:var(--card);border-radius:28px 28px 10px 10px;padding:30px 26px;box-shadow:0 12px 40px rgba(0,0,0,.25);}
  .brand{text-align:center;margin-bottom:20px;color:#fff;}
  .brand h1{margin:0;font-size:18px;color:#fff;}
  .brand p{margin:4px 0 0;font-size:12.5px;color:rgba(255,255,255,.75);}
  h2.title{margin:0 0 6px;color:var(--green);font-size:18px;text-align:center;}
  p.sub{margin:0 0 20px;color:var(--inkSoft);font-size:13px;text-align:center;}
  label{display:block;font-size:12.5px;color:var(--inkSoft);font-weight:600;margin-bottom:6px;}
  input,select{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:15px;
    font-family:inherit;margin-bottom:14px;background:#FDFCF8;}
  input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,155,60,.15);}
  .btn{width:100%;padding:11px;border-radius:10px;font-size:15px;font-weight:700;font-family:inherit;
    cursor:pointer;border:1px solid var(--green);background:var(--green);color:#fff;}
  .btn:disabled{opacity:.6;cursor:default;}
  .err{color:var(--due);font-size:13px;margin:-6px 0 12px;min-height:14px;font-weight:600;text-align:center;}
  .profile{display:flex;gap:14px;align-items:center;margin-bottom:18px;}
  .profile .photo{width:64px;height:64px;border-radius:14px;background:var(--sage);display:flex;align-items:center;
    justify-content:center;font-size:28px;flex-shrink:0;overflow:hidden;}
  .profile .photo img{width:100%;height:100%;object-fit:cover;}
  .profile .info div{font-size:13px;color:var(--inkSoft);}
  .profile .info .name{font-weight:700;font-size:16px;color:var(--green);margin-bottom:2px;}
  .section-title{font-weight:700;color:var(--green);font-size:14px;margin:18px 0 8px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:right;}
  th{color:var(--inkSoft);font-size:11.5px;font-weight:600;}
  .chip{padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .chip.due{background:#FBE9E2;color:var(--due);} .chip.paid{background:#E3F1E6;color:var(--paid);}
  .pct{font-weight:700;}
  .backlink{display:block;text-align:center;margin-top:16px;color:var(--inkSoft);font-size:13px;cursor:pointer;}
  .empty-note{color:var(--inkSoft);font-size:13px;text-align:center;padding:10px 0;}
  .setup-box{background:var(--sage);border-radius:14px;padding:16px;font-size:12.5px;line-height:1.7;color:var(--inkSoft);}
</style>
</head>

const BN_DIGITS = ["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
function bn(n){ return String(n).replace(/[0-9]/g, d => BN_DIGITS[d]); }
function taka(n){ return "৳" + bn(Number(n||0).toLocaleString("en-IN")); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const MONTHS_BN = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
function monthKeyLabel(key){ const [y,m] = key.split("-"); return MONTHS_BN[parseInt(m,10)-1] + " " + bn(y); }
function gradeOf(pct){
  if(pct>=80) return "মুমতাজ";
  if(pct>=65) return "জায়্যিদ জিদ্দান";
  if(pct>=50) return "জায়্যিদ";
  if(pct>=33) return "মাকবুল";
  return "রাসিব (অকৃতকার্য)";
}

function initFirestore(){
  if(!isConfigured()) return null;
  try{
    if(!firebase.apps || !firebase.apps.length){ firebase.initializeApp(FIREBASE_CONFIG); }
    return firebase.firestore();
  }catch(e){ console.error(e); return null; }
}
async function ensureAuth(){
  if(typeof firebase === "undefined" || !firebase.auth){ return false; }
  try{
    if(firebase.auth().currentUser) return true;
    await firebase.auth().signInAnonymously();
    return true;
  }catch(e){ console.error("Auth failed:", e); return false; }
}

function renderLoginForm(errorMsg){
  app.innerHTML = `
    <h2 class="title">ছাত্রের তথ্য দেখুন</h2>
    <p class="sub">ছাত্র আইডি নং ও মোবাইল নম্বর দিন</p>
    <div class="err">${errorMsg || ""}</div>
    <form id="lookupForm">
      <label>ছাত্র আইডি নং</label>
      <input id="sidInput" placeholder="যেমনঃ ২০২৬-০০০১" required>
      <label>মোবাইল নম্বর</label>
      <input id="mobileInput" placeholder="ভর্তির সময় দেওয়া মোবাইল নম্বর" required>
      <button class="btn" type="submit">🔎 তথ্য দেখুন</button>
    </form>
  `;
  document.getElementById("lookupForm").addEventListener("submit", function(e){
    e.preventDefault();
    const sid = document.getElementById("sidInput").value.trim();
    const mobile = document.getElementById("mobileInput").value.trim();
    doLookup(sid, mobile);
  });
}

async function doLookup(sid, mobile){
  if(!db){ renderLoginForm("সংযোগ প্রস্তুত নয়। পাতাটি আবার লোড করুন।"); return; }
  const authOk = await ensureAuth();
  if(!authOk){ renderLoginForm("সংযোগ স্থাপন করা যায়নি। ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।"); return; }
  try{
    const doc = await db.collection("students").doc(sid).get();
    if(!doc.exists){ renderLoginForm("এই আইডি নম্বরে কোনো ছাত্র পাওয়া যায়নি।"); return; }
    const student = doc.data();
    if(String(student.mobile||"").trim() !== mobile){ renderLoginForm("তথ্য মিলছে না। আইডি ও মোবাইল নম্বর সঠিকভাবে দিন।"); return; }
    await renderStudentInfo(student);
  }catch(e){
    console.error(e);
    renderLoginForm("তথ্য আনতে সমস্যা হয়েছে। ইন্টারনেট সংযোগ পরীক্ষা করুন।");
  }
}

async function renderStudentInfo(student){
  app.innerHTML = `<div class="empty-note">তথ্য লোড হচ্ছে...</div>`;

  const [attSnap, boardSnap, resultsSnap, feesSnap, payCfgSnap, myClaimsSnap] = await Promise.all([
    db.collection("attendanceSummary").where("sid","==",student.sid).get(),
    db.collection("boardingAttendanceSummary").where("sid","==",student.sid).get(),
    db.collection("results").where("sid","==",student.sid).get(),
    db.collection("fees").where("sid","==",student.sid).get(),
    db.collection("settings").doc("payment").get(),
    db.collection("paymentClaimsLog").where("sid","==",student.sid).get()
  ]);

  const attRows = attSnap.docs.map(d=>d.data()).sort((a,b)=>b.month.localeCompare(a.month));
  const boardRows = boardSnap.docs.map(d=>d.data()).sort((a,b)=>b.month.localeCompare(a.month));
  const resultRows = resultsSnap.docs.map(d=>d.data());
  const feeRows = feesSnap.docs.map(d=>d.data()).sort((a,b)=>(b.year+b.month).localeCompare(a.year+a.month));

  const examGroups = {};
  resultRows.forEach(r=>{
    examGroups[r.examName] = examGroups[r.examName] || [];
    examGroups[r.examName].push(r);
  });

  const attHTML = attRows.length ? `<table><thead><tr><th>মাস</th><th>উপস্থিত</th><th>অনুপস্থিত</th><th>ছুটি</th><th>হার</th></tr></thead>
    <tbody>${attRows.slice(0,6).map(r=>{
      const total = r.present+r.absent+r.leave;
      const pct = total ? Math.round(r.present/total*100) : 0;
      return `<tr><td>${monthKeyLabel(r.month)}</td><td>${bn(r.present)}</td><td>${bn(r.absent)}</td><td>${bn(r.leave)}</td>
        <td class="pct" style="color:${pct>=75?'var(--paid)':pct>=50?'var(--gold)':'var(--due)'};">${bn(pct)}%</td></tr>`;
    }).join("")}</tbody></table>` : `<div class="empty-note">এখনো হাজিরার তথ্য নেই।</div>`;

  const boardHTML = boardRows.length ? `<table><thead><tr><th>মাস</th><th>উপস্থিত</th><th>অনুপস্থিত</th><th>ছুটি</th><th>হার</th></tr></thead>
    <tbody>${boardRows.slice(0,6).map(r=>{
      const total = r.present+r.absent+r.leave;
      const pct = total ? Math.round(r.present/total*100) : 0;
      return `<tr><td>${monthKeyLabel(r.month)}</td><td>${bn(r.present)}</td><td>${bn(r.absent)}</td><td>${bn(r.leave)}</td>
        <td class="pct" style="color:${pct>=75?'var(--paid)':pct>=50?'var(--gold)':'var(--due)'};">${bn(pct)}%</td></tr>`;
    }).join("")}</tbody></table>` : "";

  const resultHTML = Object.keys(examGroups).length ? Object.entries(examGroups).map(([examName, subs])=>{
    const total = subs.reduce((s,r)=>s+Number(r.obtained||0),0);
    const fullTotal = subs.reduce((s,r)=>s+Number(r.fullMarks||100),0);
    const pct = fullTotal ? (total/fullTotal*100) : 0;
    return `<div style="margin-bottom:10px;">
      <div style="font-weight:700;font-size:13px;color:var(--green);">${esc(examName)}</div>
      <table><tbody>${subs.map(r=>`<tr><td style="text-align:right;">${esc(r.subject)}</td><td>${bn(r.obtained)}/${bn(r.fullMarks)}</td></tr>`).join("")}
        <tr><td style="font-weight:700;">মোট</td><td style="font-weight:700;">${bn(total)}/${bn(fullTotal)} — ${gradeOf(pct)}</td></tr>
      </tbody></table></div>`;
  }).join("") : `<div class="empty-note">এখনো ফলাফল প্রকাশ করা হয়নি।</div>`;

  const feeHTML = feeRows.length ? `<table><thead><tr><th>ধরন</th><th>মাস</th><th>পরিমাণ</th><th>অবস্থা</th></tr></thead>
    <tbody>${feeRows.slice(0,8).map(r=>`<tr>
      <td>${r.type==='boarding'?'বোর্ডিং বিল':'বেতন'}</td><td>${esc(r.month)} ${bn(r.year)}</td><td>${taka(r.amount)}</td>
      <td><span class="chip ${r.status==='বাকি'?'due':'paid'}">${esc(r.status)}</span></td>
    </tr>`).join("")}</tbody></table>` : `<div class="empty-note">এখনো বেতন/বিলের তথ্য নেই।</div>`;

  const payCfg = payCfgSnap.exists ? payCfgSnap.data() : null;
  const unpaid = feeRows.filter(r=>r.status==="বাকি");
  const myClaims = myClaimsSnap.docs.map(d=>d.data()).sort((a,b)=>(b.submittedAt||"").localeCompare(a.submittedAt||""));
  const paymentHTML = (payCfg && (payCfg.bkashNumber || payCfg.nagadNumber)) ? `
    <div class="section-title">📱 বিকাশ/নগদে বেতন পরিশোধ</div>
    <div style="font-size:13px;line-height:1.9;background:var(--sage);border-radius:10px;padding:10px 14px;margin-bottom:12px;">
      ${payCfg.bkashNumber ? `<div>বিকাশ (${payCfg.bkashType==="agent"?"এজেন্ট — Cash Out/Payment":"পার্সোনাল — Send Money"}): <strong style="direction:ltr;display:inline-block;">${esc(payCfg.bkashNumber)}</strong></div>` : ""}
      ${payCfg.nagadNumber ? `<div>নগদ (${payCfg.nagadType==="agent"?"এজেন্ট — Cash Out/Payment":"পার্সোনাল — Send Money"}): <strong style="direction:ltr;display:inline-block;">${esc(payCfg.nagadNumber)}</strong></div>` : ""}
      ${payCfg.instructions ? `<div style="margin-top:6px;color:var(--inkSoft);">${esc(payCfg.instructions)}</div>` : ""}
    </div>
    ${unpaid.length ? `
    <p style="font-size:12.5px;color:var(--inkSoft);margin:0 0 10px;">টাকা পাঠানোর পর নিচের ফর্মে ট্রানজেকশন আইডি (TrxID) জমা দিন — মাদরাসা কর্তৃপক্ষ যাচাই করে বেতন "পরিশোধিত" দেখাবেন।</p>
    <form id="claimForm">
      <label>কোন বিল পরিশোধ করেছেন</label>
      <select id="claimBill" required>
        ${unpaid.map((r,i)=>`<option value="${i}">${r.type==='boarding'?'বোর্ডিং বিল':'বেতন'} — ${esc(r.month)} ${bn(r.year)} (${taka(r.amount)})</option>`).join("")}
      </select>
      <label>মাধ্যম</label>
      <select id="claimMethod">
        ${payCfg.bkashNumber?`<option value="bkash">বিকাশ</option>`:""}
        ${payCfg.nagadNumber?`<option value="nagad">নগদ</option>`:""}
      </select>
      <label>যে নম্বর থেকে পাঠিয়েছেন</label>
      <input id="claimSender" required placeholder="যেমনঃ ০১৭xxxxxxxx">
      <label>ট্রানজেকশন আইডি (TrxID)</label>
      <input id="claimTrx" required style="direction:ltr;">
      <div class="err" id="claimErr"></div>
      <button class="btn" type="submit">✅ জমা দিন</button>
    </form>` : `<div class="empty-note">এই মুহূর্তে কোনো বকেয়া বিল নেই।</div>`}
    ${myClaims.length ? `
    <div style="margin-top:14px;">
      <div style="font-size:12px;color:var(--inkSoft);margin-bottom:4px;">পূর্বে জমা দেওয়া তথ্য:</div>
      ${myClaims.slice(0,3).map(c=>`<div style="font-size:12.5px;padding:6px 0;border-top:1px dashed var(--border);">
        ${esc(c.month)} ${bn(c.year)} — ${taka(c.amount)} — <span style="color:var(--inkSoft);">জমা হয়েছে, যাচাইয়ের অপেক্ষায়</span>
      </div>`).join("")}
    </div>` : ""}
  ` : "";

  app.innerHTML = `
    <div class="profile">
      <div class="photo">${student.photo?`<img src="${student.photo}">`:"👤"}</div>
      <div class="info">
        <div class="name">${esc(student.name)}</div>
        <div>শ্রেণি: ${esc(student.className)} · আইডি: ${esc(student.sid)}</div>
        <div>পিতা: ${esc(student.fatherName||"-")}</div>
      </div>
    </div>
    <div class="section-title">📅 হাজিরা (সাম্প্রতিক মাসগুলো)</div>
    ${attHTML}
    ${boardRows.length ? `<div class="section-title">🌙 বোর্ডিং হাজিরা</div>${boardHTML}` : ""}
    <div class="section-title">🎓 ফলাফল</div>
    ${resultHTML}
    <div class="section-title">💳 বেতন ও বোর্ডিং বিল</div>
    ${feeHTML}
    ${paymentHTML}
    <div class="backlink" id="backBtn">🔎 আরেকজন ছাত্রের তথ্য দেখুন</div>
  `;
  const claimForm = document.getElementById("claimForm");
  if(claimForm){
    claimForm.addEventListener("submit", async function(e){
      e.preventDefault();
      const idx = parseInt(document.getElementById("claimBill").value, 10);
      const bill = unpaid[idx];
      const senderMobile = document.getElementById("claimSender").value.trim();
      const trxId = document.getElementById("claimTrx").value.trim();
      const method = document.getElementById("claimMethod").value;
      const errEl = document.getElementById("claimErr");
      if(!bill || !senderMobile || !trxId){ errEl.textContent = "সব ঘর পূরণ করুন।"; return; }
      const submitBtn = claimForm.querySelector("button");
      submitBtn.disabled = true; submitBtn.textContent = "জমা হচ্ছে...";
      try{
        const claimData = {
          sid: student.sid, billType: bill.type, month: bill.month, year: bill.year,
          amount: bill.amount, method, senderMobile, trxId, submittedAt: new Date().toISOString()
        };
        await db.collection("paymentClaims").add(claimData);
        await db.collection("paymentClaimsLog").add(claimData);
        alert("আপনার পেমেন্ট তথ্য জমা হয়েছে। মাদরাসা কর্তৃপক্ষ যাচাই করে নিশ্চিত করবেন।");
        await renderStudentInfo(student);
      }catch(err){
        console.error(err);
        errEl.textContent = "জমা দিতে সমস্যা হয়েছে। ইন্টারনেট সংযোগ পরীক্ষা করুন।";
        submitBtn.disabled = false; submitBtn.textContent = "✅ জমা দিন";
      }
    });
  }
  document.getElementById("backBtn").addEventListener("click", ()=> renderLoginForm());
}

function renderSetupNotice(){
  app.innerHTML = `
    <h2 class="title">সেটআপ প্রয়োজন</h2>
    <p class="sub">এই পোর্টালটি এখনো ফায়ারবেসের সাথে সংযুক্ত করা হয়নি</p>
    <div class="setup-box">
      এই ফাইলের ভেতরে (উপরের দিকে) <code>FIREBASE_CONFIG</code> অংশে আপনার ফায়ারবেস প্রজেক্টের তথ্য বসান —
      ঠিক যে তথ্যগুলো অ্যাডমিন সফটওয়্যারের "অনলাইন সিঙ্ক" পাতায় দিয়েছিলেন, একই ৬টি তথ্য এখানেও বসাতে হবে।
      তারপর ফাইলটি সংরক্ষণ করে আবার খুলুন।
    </div>
  `;
}

if(isConfigured()){
  db = initFirestore();
  if(db) renderLoginForm();
  else renderSetupNotice();
} else {
  renderSetupNotice();
}
</script>
</body>
</html>
