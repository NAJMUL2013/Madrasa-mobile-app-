<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>বোররচর কাচারী বাজার ইসলামিয়া হুসাইনিয়া মাদরাসা — ব্যবস্থাপনা সফটওয়্যার</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14432A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="মাদরাসা অ্যাপ">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#FBF7EE; --card:#FFFFFF; --sage:#EEF2E8; --green:#14432A; --greenDeep:#0D3320;
    --gold:#C89B3C; --goldSoft:#E8D8AC; --ink:#22281F; --inkSoft:#5B6357;
    --due:#B3441E; --paid:#3D7A4E; --border:#E2DCC8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Hind Siliguri','Nirmala UI','Vrinda','Noto Sans Bengali',Arial,sans-serif;}
  h1,h2,h3{font-family:'Noto Serif Bengali','Nirmala UI',serif;}
  .shell{display:flex;min-height:100vh;}
  #sidebar{
    width:260px;background:var(--greenDeep);color:#fff;position:fixed;top:0;bottom:0;left:-270px;
    transition:left .2s ease;z-index:40;overflow-y:auto;
  }
  #sidebar.open{left:0;}
  .side-head{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.12);}
  .eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11px;letter-spacing:1px;color:var(--goldSoft);font-weight:600;}
  .side-head h1{margin:0;font-size:17px;line-height:1.45;font-weight:700;}
  .side-head p{margin:5px 0 0;font-size:12px;color:rgba(255,255,255,.65);}
  nav.mainnav{padding:10px;}
  nav.mainnav button{
    width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:3px;border-radius:10px;
    border:none;cursor:pointer;text-align:right;font-family:inherit;font-size:14px;font-weight:500;
    background:transparent;color:rgba(255,255,255,.88);
  }
  nav.mainnav button.active{background:var(--gold);color:var(--greenDeep);font-weight:700;}
  #overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:none;}
  #overlay.show{display:block;}
  main{flex:1;padding:18px 18px 60px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;}
  .icon-btn{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:15px;}
  .backup-actions{display:flex;gap:8px;}
  .content-wrap{max-width:1100px;margin:0 auto;}
  .arch{background:var(--card);border:1px solid var(--border);border-radius:28px 28px 10px 10px;box-shadow:0 1px 2px rgba(20,67,42,.05);}
  .sec-head{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
  .sec-head .badge{width:46px;height:46px;border-radius:16px 16px 6px 6px;background:var(--green);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;}
  .sec-head h2{margin:0;font-size:21px;color:var(--green);}
  .sec-head p{margin:2px 0 0;color:var(--inkSoft);font-size:13.5px;}
  .stat-row{display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
  .stat{padding:16px 18px;flex:1;min-width:150px;}
  .stat .lbl{font-size:12.5px;color:var(--inkSoft);font-weight:600;margin-bottom:6px;}
  .stat .val{font-size:21px;font-weight:700;font-family:'Noto Serif Bengali',serif;color:var(--green);}
  .stat .val.due{color:var(--due);} .stat .val.paid{color:var(--paid);}
  .form-card{padding:20px;margin-bottom:22px;}
  form.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media (max-width:800px){ form.grid{grid-template-columns:repeat(2,1fr);} }
  label.field{display:flex;flex-direction:column;gap:6px;}
  label.field span{font-size:12.5px;color:var(--inkSoft);font-weight:600;}
  input,select{border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:14.5px;
    font-family:inherit;color:var(--ink);background:#FDFCF8;outline:none;width:100%;}
  input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,155,60,.15);}
  .btn{padding:9px 16px;border-radius:10px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--green);background:var(--green);color:#fff;}
  .btn.ghost{background:transparent;color:var(--green);}
  .btn.small{padding:6px 12px;font-size:13px;}
  .btn-end{display:flex;align-items:flex-end;}
  table{width:100%;border-collapse:collapse;font-size:13.8px;}
  th{text-align:right;padding:10px 12px;color:var(--inkSoft);font-weight:600;font-size:12.5px;
    border-bottom:2px solid var(--border);white-space:nowrap;}
  th.l,td.l{text-align:right;}
  td{padding:10px 12px;border-bottom:1px solid var(--border);}
  .tbl-toolbar{padding:14px 16px 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .search-box{position:relative;width:230px;}
  .search-box input{padding-right:30px;}
  .search-box .ic{position:absolute;right:10px;top:9px;color:var(--inkSoft);font-size:14px;}
  .tbl-body{padding:12px;overflow-x:auto;}
  .empty{padding:36px 16px;text-align:center;color:var(--inkSoft);font-size:14px;}
  .del-btn{background:none;border:none;cursor:pointer;color:var(--inkSoft);font-size:15px;padding:2px 3px;}
  .action-icons{display:inline-flex;align-items:center;gap:1px;}
  .student-picker{position:relative;}
  .student-suggest{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);
    border-radius:10px;margin-top:4px;max-height:220px;overflow-y:auto;z-index:30;box-shadow:0 8px 22px rgba(0,0,0,.12);}
  .student-suggest .item{padding:8px 12px;cursor:pointer;font-size:13.5px;border-bottom:1px solid var(--border);}
  .student-suggest .item:last-child{border-bottom:none;}
  .student-suggest .item:hover{background:var(--sage);}
  .student-suggest .empty-item{padding:10px 12px;color:var(--inkSoft);font-size:13px;}
  .status-chip{border:none;cursor:pointer;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:20px;}
  .status-due{background:#FBE9E2;color:var(--due);}
  .status-paid{background:#E3F1E6;color:var(--paid);}
  .grade{font-weight:700;}
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}
  .nav-card{padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px;color:var(--ink);}
  .month-row{cursor:pointer;}
  .month-detail{background:var(--sage);}
  .mini-cal{border:1px solid var(--border);border-radius:14px;padding:12px;margin-top:10px;max-width:280px;background:#FDFCF8;}
  .mini-cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700;color:var(--green);font-size:13.5px;}
  .mini-cal-head button{background:none;border:1px solid var(--border);border-radius:8px;width:26px;height:26px;cursor:pointer;color:var(--green);font-size:14px;}
  .mini-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .mini-cal-weekdays{margin-bottom:4px;}
  .mini-cal-weekdays div{text-align:center;font-size:11px;color:var(--inkSoft);font-weight:600;}
  .cal-day{border:none;background:transparent;border-radius:8px;padding:6px 0;font-size:12.5px;cursor:pointer;color:var(--ink);font-family:inherit;}
  .cal-day:hover{background:var(--sage);}
  .cal-day.today{border:1px solid var(--gold);}
  .cal-day.sel{background:var(--green);color:#fff;font-weight:700;}
  @media (min-width:900px){
    #sidebar{left:0;}
    main{margin-left:260px;}
    #menuBtn{display:none;}
    #overlay{display:none !important;}
  }
  #lockOverlay{
    position:fixed;inset:0;z-index:1000;background:var(--greenDeep);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  #lockOverlay.hidden{display:none;}
  .lock-box{background:var(--card);border-radius:24px 24px 8px 8px;padding:32px 30px;max-width:380px;width:100%;
    box-shadow:0 10px 40px rgba(0,0,0,.3);}
  .lock-box .eyebrow2{display:flex;align-items:center;gap:8px;color:var(--gold);font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:8px;}
  .lock-box h2{margin:0 0 6px;color:var(--green);font-size:19px;}
  .lock-box p.hint{color:var(--inkSoft);font-size:13px;margin:0 0 18px;}
  .lock-box label.field{margin-bottom:12px;}
  .lock-box input[type=password], .lock-box input[type=text]{letter-spacing:3px;font-size:17px;text-align:center;}
  .lock-error{color:var(--due);font-size:13px;margin:-4px 0 12px;display:none;}
  .lock-error.show{display:block;}
  .lock-links{margin-top:14px;text-align:center;}
  .lock-links a{color:var(--inkSoft);font-size:12.5px;cursor:pointer;text-decoration:underline;}
</style>
</head>
<body>
<div id="lockOverlay" class="hidden"></div>
<div class="shell">
  <aside id="sidebar">
    <div class="side-head">
      <div id="sidebarLogoContainer" style="text-align:center;"></div>
      <div class="eyebrow">🌙 মাদরাসা ব্যবস্থাপনা</div>
      <h1>বোররচর কাচারী বাজার ইসলামিয়া হুসাইনিয়া মাদরাসা</h1>
      <p>ময়মনসিংহ সদর, ময়মনসিংহ</p>
    </div>
    <nav class="mainnav" id="navList"></nav>
  </aside>
  <div id="overlay"></div>
  <main>
    <div class="topbar">
      <button class="icon-btn" id="menuBtn">☰ মেনু</button>
      <div class="backup-actions">
        <button class="btn ghost small" id="changePinBtn">🔑 কোড পরিবর্তন</button>
        <button class="btn ghost small" id="lockBtn">🔒 লক করুন</button>
        <button class="btn ghost small" id="exportBtn" title="মোবাইলে চাপলে শেয়ার মেনু খুলবে — সেখান থেকে Google Drive, OneDrive বা অন্য যেকোনো জায়গায় সংরক্ষণ করা যাবে">⬇ ব্যাকআপ / Drive / OneDrive</button>
        <button class="btn ghost small" id="importBtn">⬆ ব্যাকআপ ইমপোর্ট</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </div>
    <div class="content-wrap" id="content"></div>
  </main>
</div>

<script>
/* ============================ ডেটা ও ইউটিলিটি ============================ */
const DB_KEY = "madrasaDB_v2";

function defaultDB(){
  return {
    incomeReceipts:[], expenseVouchers:[], fixedAssets:[], movableAssets:[],
    libraryAccounts:[], boardingAccounts:[], students:[], monthlyFees:[],
    boardingBills:[], classRoutine:[], examRoutine:[], results:[],
    studentIdCounters:{}, attendance:[], boardingAttendance:[],
    libraryLoans:[], patronMembers:[], patronPayments:[],
    teachers:[], teacherAssignments:[], teacherAttendance:[], teacherIdCounters:{}, teacherSalaries:[]
  };
}
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw) return Object.assign(defaultDB(), JSON.parse(raw));
  }catch(e){}
  return defaultDB();
}
let db = loadDB();
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }

/* ============================ গোপন কোড (PIN) সুরক্ষা ============================ */
const PIN_KEY = "madrasaPIN_v1";
function simpleHash(str){
  let h = 5381;
  for(let i=0;i<str.length;i++){ h = ((h*33) ^ str.charCodeAt(i)) >>> 0; }
  return h.toString(16);
}
function getStoredPinHash(){ return localStorage.getItem(PIN_KEY); }
function setStoredPinHash(hash){ localStorage.setItem(PIN_KEY, hash); }
function clearStoredPin(){ localStorage.removeItem(PIN_KEY); }

function showLockOverlay(mode, errorMsg){
  const overlay = document.getElementById("lockOverlay");
  overlay.classList.remove("hidden");
  overlay.innerHTML = lockScreenHTML(mode, errorMsg);
}
function hideLockOverlay(){
  document.getElementById("lockOverlay").classList.add("hidden");
}

function lockScreenHTML(mode, errorMsg){
  const err = errorMsg ? `<div class="lock-error show">${esc(errorMsg)}</div>` : `<div class="lock-error"></div>`;
  if(mode === "set"){
    return `<div class="lock-box">
      <div class="eyebrow2">🔐 প্রথমবার ব্যবহার</div>
      <h2>একটি গোপন কোড নির্ধারণ করুন</h2>
      <p class="hint">এই কোড ছাড়া কেউ সফটওয়্যারটি খুলতে পারবে না। ৪-৮ সংখ্যার একটি কোড দিন এবং মনে রাখুন — ভুলে গেলে পুনরুদ্ধার করা যায় না।</p>
      <form data-form="pin-set">
        <label class="field"><span>নতুন গোপন কোড</span><input type="password" inputmode="numeric" name="pin1" maxlength="8" autofocus required></label>
        <label class="field"><span>আবার লিখুন</span><input type="password" inputmode="numeric" name="pin2" maxlength="8" required></label>
        ${err}
        <button class="btn" type="submit" style="width:100%;justify-content:center;">কোড নির্ধারণ করুন</button>
      </form>
    </div>`;
  }
  if(mode === "change"){
    return `<div class="lock-box">
      <div class="eyebrow2">🔑 গোপন কোড পরিবর্তন</div>
      <h2>নতুন গোপন কোড দিন</h2>
      <p class="hint">পরিবর্তন করতে আগে বর্তমান কোডটি যাচাই করতে হবে।</p>
      <form data-form="pin-change">
        <label class="field"><span>বর্তমান গোপন কোড</span><input type="password" inputmode="numeric" name="oldPin" maxlength="8" autofocus required></label>
        <label class="field"><span>নতুন গোপন কোড</span><input type="password" inputmode="numeric" name="pin1" maxlength="8" required></label>
        <label class="field"><span>নতুন কোড আবার লিখুন</span><input type="password" inputmode="numeric" name="pin2" maxlength="8" required></label>
        ${err}
        <div style="display:flex;gap:10px;">
          <button class="btn" type="submit" style="flex:1;justify-content:center;">কোড পরিবর্তন করুন</button>
          <button class="btn ghost" type="button" id="pinChangeCancel" style="flex:1;justify-content:center;">বাতিল</button>
        </div>
      </form>
    </div>`;
  }
  if(mode === "guardian"){
    return `<div class="lock-box">
      <div class="eyebrow2">👨‍👩‍👦 অভিভাবক তথ্য দেখুন</div>
      <h2>ছাত্রের তথ্য খুঁজুন</h2>
      <p class="hint">সন্তানের ছাত্র আইডি নং ও ভর্তির সময় দেওয়া মোবাইল নম্বরটি দিন — কোনো গোপন কোডের প্রয়োজন নেই।</p>
      <form data-form="guardian-lookup">
        <label class="field"><span>ছাত্র আইডি নং</span><input name="sid" autofocus required placeholder="যেমনঃ ২০২৬-০০০১"></label>
        <label class="field"><span>মোবাইল নম্বর</span><input name="mobile" required></label>
        ${err}
        <button class="btn" type="submit" style="width:100%;justify-content:center;">খুঁজুন</button>
      </form>
      <div class="lock-links"><a id="guardianBackToLogin">🔑 প্রশাসনিক প্রবেশে ফিরে যান</a></div>
    </div>`;
  }
  if(mode === "guardianResult"){
    return guardianResultHTML(currentGuardianStudent);
  }
  // unlock
  return `<div class="lock-box">
    <div class="eyebrow2">🌙 মাদরাসা ব্যবস্থাপনা</div>
    <h2>গোপন কোড দিন</h2>
    <p class="hint">সফটওয়্যারটি ব্যবহার করতে আপনার গোপন কোডটি লিখুন।</p>
    <form data-form="pin-unlock">
      <label class="field"><span>গোপন কোড</span><input type="password" inputmode="numeric" name="pin" maxlength="8" autofocus required></label>
      ${err}
      <button class="btn" type="submit" style="width:100%;justify-content:center;">প্রবেশ করুন</button>
    </form>
    <div class="lock-links"><a id="forgotPinLink">গোপন কোড ভুলে গেছেন?</a> &nbsp;·&nbsp; <a id="guardianViewLink">👨‍👩‍👦 অভিভাবক তথ্য দেখুন</a></div>
  </div>`;
}

let currentGuardianStudent = null;
function studentAttendanceStats(studentId, year, month){
  const prefix = year + "-" + String(month).padStart(2,"0");
  const records = db.attendance.filter(a => a.studentId===studentId && a.date && a.date.slice(0,7)===prefix);
  const present = records.filter(r=>r.status==="উপস্থিত").length;
  return { present, total: records.length, pct: records.length ? Math.round(present/records.length*100) : null };
}
function studentBoardingAttendanceStats(studentId, year, month){
  const prefix = year + "-" + String(month).padStart(2,"0");
  const records = db.boardingAttendance.filter(a => a.studentId===studentId && a.date && a.date.slice(0,7)===prefix);
  const present = records.filter(r=>r.status==="উপস্থিত").length;
  return { present, total: records.length, pct: records.length ? Math.round(present/records.length*100) : null };
}
function guardianResultHTML(s){
  if(!s) return `<div class="lock-box"><p>ছাত্র পাওয়া যায়নি।</p><button class="btn" id="guardianBack" type="button" style="width:100%;justify-content:center;">🔎 আবার খুঁজুন</button></div>`;
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth()+1;
  const att = studentAttendanceStats(s.id, y, m);
  const isBoarder = s.boardingQuota && String(s.boardingQuota).trim()!=="";
  const batt = isBoarder ? studentBoardingAttendanceStats(s.id, y, m) : null;
  const fees = db.monthlyFees.filter(f=>f.studentId===s.id).slice(0,3);
  const bills = isBoarder ? db.boardingBills.filter(f=>f.studentId===s.id).slice(0,3) : [];
  const results = db.results.filter(r=>r.studentId===s.id).slice(0,3);
  return `<div class="lock-box" style="max-width:420px;">
    <div style="text-align:center;margin-bottom:12px;">
      ${s.photo?`<img src="${s.photo}" style="width:72px;height:72px;border-radius:14px;object-fit:cover;">`:""}
      <h2 style="margin:8px 0 2px;">${esc(s.name)}</h2>
      <div style="color:var(--inkSoft);font-size:13px;">${esc(s.sid||"-")} — ${esc(s.className)}</div>
    </div>
    <div style="font-size:13.5px;line-height:1.75;text-align:right;">
      <p style="margin:0 0 10px;"><strong>এই মাসের ক্লাস হাজিরা:</strong><br>${att.total ? bn(att.present)+"/"+bn(att.total)+" দিন উপস্থিত ("+bn(att.pct)+"%)" : "এখনো তথ্য নেই"}</p>

function handlePinForm(type, fd){
  if(type === "pin-set"){
    const p1 = fd.get("pin1"), p2 = fd.get("pin2");
    if(!/^[0-9]{4,8}$/.test(p1)){ showLockOverlay("set", "কোডটি অবশ্যই ৪-৮ সংখ্যার হতে হবে।"); return; }
    if(p1 !== p2){ showLockOverlay("set", "দুটি কোড মিলছে না, আবার চেষ্টা করুন।"); return; }
    setStoredPinHash(simpleHash(p1));
    hideLockOverlay();
    renderContent();
    return;
  }
  if(type === "pin-unlock"){
    const pin = fd.get("pin");
    if(simpleHash(pin) !== getStoredPinHash()){ showLockOverlay("unlock", "কোডটি সঠিক নয়, আবার চেষ্টা করুন।"); return; }
    hideLockOverlay();
    renderContent();
    return;
  }
  if(type === "pin-change"){
    const oldPin = fd.get("oldPin"), p1 = fd.get("pin1"), p2 = fd.get("pin2");
    if(simpleHash(oldPin) !== getStoredPinHash()){ showLockOverlay("change", "বর্তমান কোডটি সঠিক নয়।"); return; }
    if(!/^[0-9]{4,8}$/.test(p1)){ showLockOverlay("change", "নতুন কোডটি অবশ্যই ৪-৮ সংখ্যার হতে হবে।"); return; }
    if(p1 !== p2){ showLockOverlay("change", "নতুন কোড দুটি মিলছে না।"); return; }
    setStoredPinHash(simpleHash(p1));
    hideLockOverlay();
    alert("গোপন কোড সফলভাবে পরিবর্তন হয়েছে।");
    return;
  }
}

const BN_DIGITS = ["০","১","২","৩","৪","৫","৬","৭","৮","৯"];
function bn(n){ return String(n).replace(/[0-9]/g, d => BN_DIGITS[d]); }
function taka(n){ return "৳" + bn(Number(n||0).toLocaleString("en-IN")); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function shiftDate(dateStr, delta){
  const d = dateStr ? new Date(dateStr+"T00:00:00") : new Date();
  d.setDate(d.getDate() + delta);
  return d.toISOString().slice(0,10);
}
function daysInMonth(year, month){
  return new Date(Number(year), Number(month), 0).getDate();
}
function updateLiveTally(namePrefix, containerId){
  const el = document.getElementById(containerId);
  if(!el) return;
  const radios = document.querySelectorAll(`input[type="radio"][name^="${namePrefix}"]:checked`);
  let present=0, absent=0, leave=0;
  radios.forEach(r=>{
    if(r.value==="উপস্থিত") present++;
    else if(r.value==="অনুপস্থিত") absent++;
    else if(r.value==="ছুটি") leave++;
  });
  const total = present+absent+leave;
  el.innerHTML = `
    <span>✅ উপস্থিত: <strong style="color:var(--paid);">${bn(present)}</strong></span>
    <span>❌ অনুপস্থিত: <strong style="color:var(--due);">${bn(absent)}</strong></span>
    <span>🟡 ছুটি: <strong style="color:var(--gold);">${bn(leave)}</strong></span>
    <span>👥 মোট: <strong>${bn(total)}</strong></span>`;
}
function getAttContext(ctx){

function setAttDate(ctx, iso){

}
function renderMiniCalendar(ctx){
  const st = getAttContext(ctx);
  if(!st.calendarOpen) return "";
  const year = st.calendarYear, month = st.calendarMonth;
  const firstDay = new Date(year, month-1, 1);
  const shift = (firstDay.getDay() + 1) % 7;
  const totalDays = new Date(year, month, 0).getDate();
  const todayStr = todayISO();
  let cells = "";
  for(let i=0;i<shift;i++) cells += `<div></div>`;
  for(let d=1; d<=totalDays; d++){
    const iso = year + "-" + String(month).padStart(2,"0") + "-" + String(d).padStart(2,"0");
    const isToday = iso === todayStr;
    const isSel = iso === st.date;
    cells += `<button type="button" class="cal-day ${isSel?'sel':''} ${isToday?'today':''}" data-cal-pick="${ctx}:${iso}">${bn(d)}</button>`;
  }
  const weekHeaders = ["শনি","রবি","সোম","মঙ্গল","বুধ","বৃহঃ","শুক্র"];
  return `<div class="mini-cal">
    <div class="mini-cal-head">
      <button type="button" data-cal-nav="${ctx}:-1">‹</button>
      <span>${MONTHS_BN[month-1]} ${bn(year)}</span>
      <button type="button" data-cal-nav="${ctx}:1">›</button>
    </div>
    <div class="mini-cal-grid mini-cal-weekdays">${weekHeaders.map(w=>`<div>${w}</div>`).join("")}</div>
    <div class="mini-cal-grid">${cells}</div>
  </div>`;
}

function generateStudentId(dateStr){
  const year = dateStr ? dateStr.slice(0,4) : String(new Date().getFullYear());
  db.studentIdCounters[year] = (db.studentIdCounters[year] || 0) + 1;
  const seq = String(db.studentIdCounters[year]).padStart(4,"0");
  return bn(year) + "-" + bn(seq);
}
function backfillStudentIds(){
  const missing = db.students.filter(s=>!s.sid).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  if(!missing.length){ alert("সকল ছাত্রের আইডি নম্বর ইতিমধ্যে আছে।"); return; }
  missing.forEach(s=>{ s.sid = generateStudentId(s.date); });
  saveDB(); renderContent();
  alert(bn(missing.length) + " জন ছাত্রের আইডি নম্বর তৈরি হয়েছে।");
}
function bulkImportPatrons(){
  const textarea = document.getElementById("bulkPatronsInput");
  if(!textarea || !textarea.value.trim()){ alert("প্রথমে তথ্য পেস্ট করুন।"); return; }
  const lines = textarea.value.split("\n").map(l=>l.trim()).filter(l=>l.length>0);
  let added = 0, skipped = 0;
  const today = todayISO();
  lines.forEach(line=>{
    const parts = (line.includes("\t") ? line.split("\t") : line.split(",")).map(p=>p.trim());
    const [name, mobile, address, subType, amount] = parts;
    if(!name || name.includes("সদস্যের নাম")){ skipped++; return; }
    db.patronMembers.unshift({
      id: uid(), name, mobile: mobile||"", address: address||"",
      subType: (subType==="বাৎসরিক") ? "বাৎসরিক" : "মাসিক",
      amount: amount||"", joinDate: today
    });
    added++;
  });
  saveDB();
  textarea.value = "";
  renderContent();
  alert(bn(added) + " জন সদস্য যোগ করা হয়েছে।" + (skipped ? " (" + bn(skipped) + " টি লাইন বাদ দেওয়া হয়েছে)" : ""));
}
function bulkImportStudents(){
  const textarea = document.getElementById("bulkStudentsInput");
  if(!textarea || !textarea.value.trim()){ alert("প্রথমে তথ্য পেস্ট করুন।"); return; }
  const lines = textarea.value.split("\n").map(l=>l.trim()).filter(l=>l.length>0);
  let added = 0, skipped = 0;
  const today = todayISO();
  const isValidDate = (v) => /^\d{4}-\d{2}-\d{2}$/.test(v||"");
  lines.forEach(line=>{
    const parts = (line.includes("\t") ? line.split("\t") : line.split(",")).map(p=>p.trim());
    const [admissionNo, name, fatherName, address, className, feeQuota, boardingQuota, mobile, dob, admissionDate] = parts;
    if(!name || name.includes("ছাত্রের নাম")){ skipped++; return; }
    const finalAdmissionDate = isValidDate(admissionDate) ? admissionDate : today;
    const sid = generateStudentId(finalAdmissionDate);
    db.students.unshift({
      id: uid(), sid, admissionNo: admissionNo||"", name, fatherName: fatherName||"",
      dob: isValidDate(dob) ? dob : "", className: className || CLASSES[0], address: address||"",
      mobile: mobile||"", date: finalAdmissionDate, feeQuota: feeQuota||"", boardingQuota: boardingQuota||""
    });
    added++;
  });
  saveDB();
  textarea.value = "";
  renderContent();
  alert(bn(added) + " জন ছাত্র যোগ করা হয়েছে।" + (skipped ? " (" + bn(skipped) + " টি লাইন বাদ দেওয়া হয়েছে)" : ""));
}

function fmtDate(iso){
  if(!iso) return "-";
  const [y,m,d] = iso.split("-");
  const short = ["জানু","ফেব্রু","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্ট","অক্টো","নভে","ডিসে"];
  return bn(d) + " " + short[parseInt(m,10)-1] + " " + bn(y);
}
function monthKey(iso){ if(!iso) return "অজানা"; return iso.slice(0,7); }
function monthKeyLabel(key){
  if(key === "অজানা") return key;
  const [y,m] = key.split("-");
  return MONTHS_BN[parseInt(m,10)-1] + " " + bn(y);
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function telLink(mobile){
  if(!mobile) return "-";
  const clean = String(mobile).replace(/[^0-9+]/g, "");

function renderDashboard(){
  const generalIncome = db.incomeReceipts.reduce((s,i)=>s+Number(i.amount||0),0);
  const feePaid = db.monthlyFees.filter(f=>f.status==="পরিশোধিত").reduce((s,f)=>s+Number(f.amount||0),0);
  const boardingPaid = db.boardingBills.filter(f=>f.status==="পরিশোধিত").reduce((s,f)=>s+Number(f.amount||0),0);
  const patronPaid = db.patronPayments.filter(f=>f.status==="পরিশোধিত").reduce((s,f)=>s+Number(f.amount||0),0);
  const income = generalIncome + feePaid + boardingPaid + patronPaid;
  const generalExpense = db.expenseVouchers.reduce((s,i)=>s+Number(i.amount||0),0);
  const teacherSalaryPaid = db.teacherSalaries.filter(f=>f.status==="পরিশোধিত").reduce((s,f)=>s+Number(f.amount||0),0);
  const expense = generalExpense + teacherSalaryPaid;
  const todayRecords = db.attendance.filter(a=>a.date===todayISO());
  const todayPresent = todayRecords.filter(r=>r.status==="উপস্থিত").length;
  const todayBoarding = db.boardingAttendance.filter(a=>a.date===todayISO());
  const todayBoardingPresent = todayBoarding.filter(r=>r.status==="উপস্থিত").length;
  const todayTeacherAtt = db.teacherAttendance.filter(a=>a.date===todayISO());
  const todayTeacherPresent = todayTeacherAtt.filter(r=>r.status==="উপস্থিত").length;
  return `
    <div class="sec-head"><div class="badge">🏠</div><div><h2>ড্যাশবোর্ড</h2><p>প্রতিষ্ঠানের সার্বিক অবস্থার সংক্ষিপ্ত চিত্র</p></div></div>
    <div class="stat-row">
      <div class="arch stat"><div class="lbl">মোট আয় (সাধারণ + বেতন + বোর্ডিং + বদরী)</div><div class="val paid">${taka(income)}</div></div>
      <div class="arch stat"><div class="lbl">মোট ব্যয় (সাধারণ + শিক্ষক বেতন)</div><div class="val due">${taka(expense)}</div></div>
      <div class="arch stat"><div class="lbl">জমা (আয় - ব্যয়)</div><div class="val">${taka(income-expense)}</div></div>
      <div class="arch stat"><div class="lbl">মোট ছাত্র</div><div class="val">${bn(db.students.length)}</div></div>
      <div class="arch stat"><div class="lbl">সাধারণ আয়ের রশিদ</div><div class="val">${taka(generalIncome)}</div></div>
      <div class="arch stat"><div class="lbl">মাসিক বেতন আদায়</div><div class="val">${taka(feePaid)}</div></div>
      <div class="arch stat"><div class="lbl">মাসিক বোর্ডিং বিল আদায়</div><div class="val">${taka(boardingPaid)}</div></div>
      <div class="arch stat"><div class="lbl">বদরী চাঁদা আদায়</div><div class="val">${taka(patronPaid)}</div></div>
      <div class="arch stat"><div class="lbl">সাধারণ ব্যয়ের ভাউচার</div><div class="val">${taka(generalExpense)}</div></div>
      <div class="arch stat"><div class="lbl">শিক্ষকদের বেতন পরিশোধ</div><div class="val">${taka(teacherSalaryPaid)}</div></div>
      <div class="arch stat"><div class="lbl">মোট শিক্ষক</div><div class="val">${bn(db.teachers.length)}</div></div>
      <div class="arch stat"><div class="lbl">আজকের হাজিরা</div><div class="val">${todayRecords.length ? bn(todayPresent)+"/"+bn(todayRecords.length) : "নেওয়া হয়নি"}</div></div>
      <div class="arch stat"><div class="lbl">আজকের বোর্ডিং হাজিরা</div><div class="val">${todayBoarding.length ? bn(todayBoardingPresent)+"/"+bn(todayBoarding.length) : "নেওয়া হয়নি"}</div></div>
      <div class="arch stat"><div class="lbl">আজকের শিক্ষক হাজিরা</div><div class="val">${todayTeacherAtt.length ? bn(todayTeacherPresent)+"/"+bn(todayTeacherAtt.length) : "নেওয়া হয়নি"}</div></div>
    </div>
    <div class="grid-cards">
      ${NAV.filter(n=>n.id!=="dashboard").map(n=>`<div class="arch nav-card" data-tab="${n.id}">${n.icon} ${n.label}</div>`).join("")}
    </div>`;
}

/* ============================ জেনেরিক লেজার ============================ */
function ledgerColumns(cfg){
  const cols = [
    {label:cfg.noLabel, get:r=>esc(r.no||"-")},
    {label:"তারিখ", get:r=>fmtDate(r.date)},
    {label:cfg.partyLabel, get:r=>esc(r.party||"-")}
  ];
  if(cfg.extraLabel) cols.push({label:cfg.extraLabel, get:r=>esc(r.extra||"-")});
  cols.push({label:"বিবরণ", get:r=>esc(r.desc||"-")});
  cols.push({label:cfg.amountLabel, get:r=>taka(r.amount)});
  return cols;
}
function filteredRows(tab, cfg){
  const q = (searchState[tab]||"").toLowerCase();
  const rows = db[cfg.key];
  if(!q) return rows;
  return rows.filter(r => [r.no,r.party,r.desc,r.extra].join(" ").toLowerCase().includes(q));
}
function ledgerTableHTML(tab){
  const cfg = LEDGER_CONFIGS[tab];
  const rows = filteredRows(tab, cfg);
  const cols = ledgerColumns(cfg);
  if(!rows.length) return `<div class="empty">এখনো কোনো তথ্য যোগ করা হয়নি।</div>`;
  const showReceipt = (tab === "income" || tab === "expense");
  return `<table>
    <thead><tr>${cols.map(c=>`<th>${c.label}</th>`).join("")}<th></th></tr></thead>
    <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c.get(r)}</td>`).join("")}
      <td style="text-align:center;white-space:nowrap;"><span class="action-icons">
        ${showReceipt ? `<button class="del-btn" data-receipt="${tab}:${r.id}" title="${tab==='income'?'রশিদ প্রিন্ট':'ভাউচার প্রিন্ট'}">🧾</button>` : ""}
        ${tab==="income" ? `<button class="del-btn" data-message="income" data-id="${r.id}" title="কনফার্মেশন মেসেজ কপি করুন">✉️</button>` : ""}
        <button class="del-btn" data-delete="${cfg.key}" data-id="${r.id}" title="মুছুন">🗑</button></span>
      </td></tr>`).join("")}
    </tbody></table>`;
}
function renderLedgerTab(tab){

    <div class="stat-row">

    <div class="arch">

      </div>
      <div class="tbl-body" id="tbl-${tab}">${ledgerTableHTML(tab)}</div>

/* ============================ মাসিক বেতন / বোর্ডিং বিল ============================ */
function billingTableHTML(tab){
  const cfg = BILLING_CONFIGS[tab];
  const sMap = studentMap();
  let rows = db[cfg.key];
  const q = (searchState[tab]||"").toLowerCase();
  if(q){
    rows = rows.filter(r=>{
      const st = sMap[r.studentId];
      return st && [st.name, st.sid, st.className, st.mobile].join(" ").toLowerCase().includes(q);
    });
  }
  if(!rows.length) return `<div class="empty">${q ? "কোনো তথ্য পাওয়া যায়নি।" : "এখনো কোনো এন্ট্রি নেই।"}</div>`;
  return `<table><thead><tr>
      <th>ছাত্র আইডি</th><th>ছাত্রের নাম</th><th>শ্রেণি</th><th>মাস/বছর</th><th>${cfg.amountLabel}</th><th>অবস্থা</th><th>পরিশোধের তারিখ</th><th></th>
    </tr></thead><tbody>${rows.map(r=>{
      const st = sMap[r.studentId];
      return `<tr>
        <td>${esc(st?st.sid||"-":"-")}</td><td>${esc(st?st.name:"অজানা")}</td><td>${esc(st?st.className:"-")}</td>
        <td>${esc(r.month)} ${bn(r.year)}</td><td>${taka(r.amount)}</td>
        <td><button class="status-chip ${r.status==='বাকি'?'status-due':'status-paid'}" data-toggle-status data-coll="${cfg.key}" data-id="${r.id}">${r.status}</button></td>
        <td>${r.payDate?fmtDate(r.payDate):"-"}</td>
        <td style="text-align:center;white-space:nowrap;"><span class="action-icons">
          <button class="del-btn" data-receipt="${tab}:${r.id}" title="রশিদ প্রিন্ট">🧾</button>
          <button class="del-btn" data-message="${tab}" data-id="${r.id}" title="মেসেজ কপি করুন">✉️</button>
          <button class="del-btn" data-delete="${cfg.key}" data-id="${r.id}">🗑</button>
        </span></td>
      </tr>`;
    }).join("")}</tbody></table>`;
}
function renderBillingTab(tab){
  const cfg = BILLING_CONFIGS[tab];

  const thisYear = new Date().getFullYear();
  return `
    <div class="sec-head"><div class="badge">💳</div><div><h2>${cfg.title}</h2><p>${cfg.subtitle}</p></div></div>
    <div class="stat-row">

      <div class="arch stat"><div class="lbl">মোট আদায়</div><div class="val paid">${taka(paid)}</div></div>
    </div>

      ${db.students.length===0 ? `<div class="empty">প্রথমে 'ছাত্র ভর্তি' অংশে ছাত্র যোগ করুন।</div>` : `

          ${studentPickerHTML(tab, null)}

        <label class="field"><span>বছর</span><input name="year" value="${thisYear}"></label>
        <label class="field"><span>${cfg.amountLabel}</span><input type="number" step="0.01" name="amount" id="amt-${tab}" required></label>
        <label class="field"><span>অবস্থা</span><select name="status"><option value="বাকি">বাকি</option><option value="পরিশোধিত">পরিশোধিত</option></select></label>
        <div class="btn-end"><button class="btn" type="submit">➕ যোগ করুন</button></div>

        <button class="btn ghost small" data-print="${tab}">🖨 প্রিন্ট করুন</button>
        <div class="search-box"><input placeholder="ছাত্রের নাম/আইডি/শ্রেণি দিয়ে খুঁজুন..." data-search="${tab}" value="${esc(searchState[tab]||'')}"><span class="ic">🔍</span></div>

    </div>`;
}

/* ============================ ফলাফল ============================ */
function gradeOf(pct){
  if(pct>=80) return ["মুমতাজ","paid"];
  if(pct>=65) return ["জায়্যিদ জিদ্দান","paid"];
  if(pct>=50) return ["জায়্যিদ","gold"];
  if(pct>=33) return ["মাকবুল","gold"];
  return ["রাসিব (অকৃতকার্য)","due"];
}
function resultsTableHTML(){
  const sMap = studentMap();
  let rows = db.results;
  const q = (searchState.results||"").toLowerCase();
  if(q){
    rows = rows.filter(r=>{
      const st = sMap[r.studentId];
      return [st?st.name:"", st?st.sid:"", r.examName, r.subject].join(" ").toLowerCase().includes(q);
    });
  }
  if(!rows.length) return `<div class="empty">${q ? "কোনো তথ্য পাওয়া যায়নি।" : "এখনো কোনো ফলাফল যোগ করা হয়নি।"}</div>`;
  return `<table><thead><tr><th>ছাত্র আইডি</th><th>ছাত্রের নাম</th><th>পরীক্ষা</th><th>বিষয়</th><th>নম্বর</th><th>গ্রেড</th><th></th></tr></thead>
    <tbody>${rows.map(r=>{
      const pct = (Number(r.obtained)/Number(r.fullMarks||1))*100;
      const [label,tone] = gradeOf(pct);
      const st = sMap[r.studentId];
      return `<tr><td>${esc(st?st.sid||"-":"-")}</td><td>${esc(st?st.name:"অজানা")}</td><td>${esc(r.examName||"-")}</td><td>${esc(r.subject)}</td>
        <td>${bn(r.obtained)} / ${bn(r.fullMarks)}</td><td class="grade" style="color:${tone==='due'?'var(--due)':'var(--paid)'};">${label}</td>
        <td style="text-align:center;"><button class="del-btn" data-delete="results" data-id="${r.id}">🗑</button></td></tr>`;
    }).join("")}</tbody></table>`;

function tabulationData(examName, classFilter){
  if(!examName) return { subjects: [], rows: [] };
  let students = classFilter === "all" ? db.students : db.students.filter(s=>s.className===classFilter);
  const relevant = db.results.filter(r=>r.examName===examName);
  const subjects = [...new Set(relevant.map(r=>r.subject))];
  const rows = students.map(s=>{
    const subjMarks = {};
    let total = 0, fullTotal = 0, anyMark = false;
    subjects.forEach(sub=>{
      const rec = relevant.find(r=>r.studentId===s.id && r.subject===sub);
      if(rec){ subjMarks[sub] = Number(rec.obtained); total += Number(rec.obtained); fullTotal += Number(rec.fullMarks||100); anyMark = true; }
      else subjMarks[sub] = null;
    });
    const pct = fullTotal ? (total/fullTotal*100) : 0;
    return { student:s, subjMarks, total, fullTotal, pct, grade: gradeOf(pct)[0], anyMark };
  }).filter(r=>r.anyMark);
  return { subjects, rows };
}

  if(!miscState.tabExamName) return `<div class="empty">একটি পরীক্ষা নির্বাচন করুন।</div>`;

function studentsInClass(className){
  if(className === "সকল শ্রেণী") return db.students;
  return db.students.filter(s => s.className === className);
}
function getAttendance(date, studentId){
  return db.attendance.find(a => a.date === date && a.studentId === studentId);
}
function saveDailyAttendance(date, className, statusMap){
  const ids = new Set(Object.keys(statusMap));
  db.attendance = db.attendance.filter(a => !(a.date === date && ids.has(a.studentId)));
  Object.entries(statusMap).forEach(([studentId, status]) => {
    db.attendance.push({ id: uid(), date, studentId, status, className });
  });
  saveDB();
}
function attendanceSummaryRows(){
  const y = String(attendanceState.reportYear);
  const m = String(attendanceState.reportMonth).padStart(2, "0");
  const prefix = y + "-" + m;
  const filterClass = attendanceState.reportClassFilter;
  const pool = filterClass === "all" ? db.students : db.students.filter(s => s.className === filterClass);
  return pool.map(s => {
    const records = db.attendance.filter(a => a.studentId === s.id && a.date && a.date.slice(0,7) === prefix);
    const present = records.filter(r => r.status === "উপস্থিত").length;
    const absent = records.filter(r => r.status === "অনুপস্থিত").length;
    const leave = records.filter(r => r.status === "ছুটি").length;
    const total = present + absent + leave;
    const pct = total ? Math.round((present/total)*100) : 0;
    const allRecords = db.attendance.filter(a => a.studentId === s.id);
    const allPresent = allRecords.filter(r => r.status === "উপস্থিত").length;
    const allAbsent = allRecords.filter(r => r.status === "অনুপস্থিত").length;
    const allLeave = allRecords.filter(r => r.status === "ছুটি").length;
    return { student:s, present, absent, leave, total, pct, allPresent, allAbsent, allLeave };
  });
}

  db.boardingAttendance = db.boardingAttendance.filter(a => !(a.date === date && ids.has(a.studentId)));

    db.boardingAttendance.push({ id: uid(), date, studentId, status });
  });
  saveDB();
}
function boardingAttendanceSummaryRows(){
  const y = String(boardingAttendanceState.reportYear);
  const m = String(boardingAttendanceState.reportMonth).padStart(2, "0");
  const prefix = y + "-" + m;
  const filterClass = boardingAttendanceState.reportClassFilter;
  let pool = boardingStudentsList();
  if(filterClass !== "all") pool = pool.filter(s => s.className === filterClass);
  return pool.map(s => {
    const records = db.boardingAttendance.filter(a => a.studentId === s.id && a.date && a.date.slice(0,7) === prefix);
    const present = records.filter(r => r.status === "উপস্থিত").length;
    const absent = records.filter(r => r.status === "অনুপস্থিত").length;
    const leave = records.filter(r => r.status === "ছুটি").length;
    const total = present + absent + leave;
    const pct = total ? Math.round((present/total)*100) : 0;
    return { student:s, present, absent, leave, total, pct };
  });
}

function getTeacherAttendance(date, teacherId){
  return db.teacherAttendance.find(a => a.date === date && a.teacherId === teacherId);
}
function saveTeacherDailyAttendance(date, statusMap){
  const ids = new Set(Object.keys(statusMap));
  db.teacherAttendance = db.teacherAttendance.filter(a => !(a.date === date && ids.has(a.teacherId)));
  Object.entries(statusMap).forEach(([teacherId, status]) => {
    db.teacherAttendance.push({ id: uid(), date, teacherId, status });
  });
  saveDB();
}
function teacherAttendanceSummaryRows(){
  const y = String(teacherAttendanceState.reportYear);
  const m = String(teacherAttendanceState.reportMonth).padStart(2, "0");
  const prefix = y + "-" + m;
  return db.teachers.map(t => {
    const records = db.teacherAttendance.filter(a => a.teacherId === t.id && a.date && a.date.slice(0,7) === prefix);
    const present = records.filter(r => r.status === "উপস্থিত").length;
    const absent = records.filter(r => r.status === "অনুপস্থিত").length;
    const leave = records.filter(r => r.status === "ছুটি").length;
    const total = present + absent + leave;
    const pct = total ? Math.round((present/total)*100) : 0;
    return { teacher:t, present, absent, leave, total, pct };
  });
}

/* ============================ মাসিক আয়-ব্যয়ের হিসাব ============================ */
function monthlyReportRows(){
  const map = {};
  const ensure = (k) => { map[k] = map[k] || {generalIncome:0, feeIncome:0, boardingIncome:0, patronIncome:0, generalExpense:0, teacherSalaryExpense:0}; return map[k]; };
  db.incomeReceipts.forEach(r=>{
    ensure(monthKey(r.date)).generalIncome += Number(r.amount||0);
  });
  db.expenseVouchers.forEach(r=>{
    ensure(monthKey(r.date)).generalExpense += Number(r.amount||0);
  });
  db.monthlyFees.forEach(r=>{
    if(r.status==="পরিশোধিত" && r.payDate) ensure(monthKey(r.payDate)).feeIncome += Number(r.amount||0);
  });
  db.boardingBills.forEach(r=>{
    if(r.status==="পরিশোধিত" && r.payDate) ensure(monthKey(r.payDate)).boardingIncome += Number(r.amount||0);
  });
  db.patronPayments.forEach(r=>{
    if(r.status==="পরিশোধিত" && r.payDate) ensure(monthKey(r.payDate)).patronIncome += Number(r.amount||0);
  });
  db.teacherSalaries.forEach(r=>{
    if(r.status==="পরিশোধিত" && r.payDate) ensure(monthKey(r.payDate)).teacherSalaryExpense += Number(r.amount||0);
  });
  return Object.keys(map).sort().reverse().map(k=>{
    const m = map[k];
    const income = m.generalIncome + m.feeIncome + m.boardingIncome + m.patronIncome;
    const expense = m.generalExpense + m.teacherSalaryExpense;
    return {
      key:k, generalIncome:m.generalIncome, feeIncome:m.feeIncome, boardingIncome:m.boardingIncome, patronIncome:m.patronIncome, income,
      generalExpense:m.generalExpense, teacherSalaryExpense:m.teacherSalaryExpense, expense
    };
  });
}

    if(saved && saved.apiKey) return saved;
  }catch(e){}
  return DEFAULT_FIREBASE_CONFIG;
}

function ensureFirestore(){
  const cfg = getFirebaseConfig();
  if(!cfg || !cfg.apiKey || !cfg.projectId){ return null; }
  if(typeof firebase === "undefined"){ return null; }
  try{
    if(!firebase.apps || !firebase.apps.length){ firebase.initializeApp(cfg); }
    return firebase.firestore();
  }catch(e){ console.error(e); return null; }
}

async function syncToCloud(){
  const statusEl = document.getElementById("syncStatus");
  const cfg = getFirebaseConfig();
  if(!cfg){ if(statusEl) statusEl.innerHTML = `<span style="color:var(--due);">প্রথমে উপরে ফায়ারবেস তথ্য দিয়ে সংরক্ষণ করুন।</span>`; return; }
  const db2 = ensureFirestore();
  if(!db2){ if(statusEl) statusEl.innerHTML = `<span style="color:var(--due);">ফায়ারবেসের সাথে সংযোগ করা যায়নি। তথ্যগুলো ঠিক আছে কিনা যাচাই করুন এবং ইন্টারনেট সংযোগ পরীক্ষা করুন।</span>`; return; }
  if(statusEl) statusEl.innerHTML = `<span style="color:var(--inkSoft);">সিঙ্ক করা হচ্ছে... অপেক্ষা করুন।</span>`;
  try{
    let batch = db2.batch();
    let opCount = 0;
    const commits = [];
    const addOp = (ref, data) => {
      batch.set(ref, data);
      opCount++;
      if(opCount >= 400){ commits.push(batch.commit()); batch = db2.batch(); opCount = 0; }
    };

    db.students.forEach(s=>{
      if(!s.sid) return;
      addOp(db2.collection("students").doc(s.sid), {
        sid: s.sid, name: s.name||"", fatherName: s.fatherName||"", className: s.className||"",
        mobile: s.mobile||"", admissionNo: s.admissionNo||"", updatedAt: new Date().toISOString()
      });
    });

    const attSummaryMap = {};
    db.attendance.forEach(a=>{
      const st = db.students.find(x=>x.id===a.studentId); if(!st || !st.sid) return;
      const mk = a.date ? a.date.slice(0,7) : ""; if(!mk) return;
      const key = st.sid+"_"+mk;
      attSummaryMap[key] = attSummaryMap[key] || {sid:st.sid, month:mk, present:0, absent:0, leave:0};
      if(a.status==="উপস্থিত") attSummaryMap[key].present++;
      else if(a.status==="অনুপস্থিত") attSummaryMap[key].absent++;
      else if(a.status==="ছুটি") attSummaryMap[key].leave++;
    });
    Object.values(attSummaryMap).forEach(rec=>{
      addOp(db2.collection("attendanceSummary").doc(rec.sid+"_"+rec.month), rec);
    });

    const boardSummaryMap = {};
    db.boardingAttendance.forEach(a=>{
      const st = db.students.find(x=>x.id===a.studentId); if(!st || !st.sid) return;
      const mk = a.date ? a.date.slice(0,7) : ""; if(!mk) return;
      const key = st.sid+"_"+mk;
      boardSummaryMap[key] = boardSummaryMap[key] || {sid:st.sid, month:mk, present:0, absent:0, leave:0};
      if(a.status==="উপস্থিত") boardSummaryMap[key].present++;
      else if(a.status==="অনুপস্থিত") boardSummaryMap[key].absent++;
      else if(a.status==="ছুটি") boardSummaryMap[key].leave++;
    });
    Object.values(boardSummaryMap).forEach(rec=>{
      addOp(db2.collection("boardingAttendanceSummary").doc(rec.sid+"_"+rec.month), rec);
    });

    db.results.forEach(r=>{
      const st = db.students.find(x=>x.id===r.studentId); if(!st || !st.sid) return;
      addOp(db2.collection("results").doc(r.id), {
        sid: st.sid, examName: r.examName||"", subject: r.subject||"",
        obtained: Number(r.obtained)||0, fullMarks: Number(r.fullMarks)||100
      });
    });

    db.monthlyFees.forEach(r=>{
      const st = db.students.find(x=>x.id===r.studentId); if(!st || !st.sid) return;
      addOp(db2.collection("fees").doc(st.sid+"_"+r.month+"_"+r.year), {
        sid: st.sid, type:"fee", month:r.month, year:r.year, amount:Number(r.amount)||0, status:r.status||"বাকি"
      });
    });
    db.boardingBills.forEach(r=>{
      const st = db.students.find(x=>x.id===r.studentId); if(!st || !st.sid) return;
      addOp(db2.collection("fees").doc(st.sid+"_board_"+r.month+"_"+r.year), {
        sid: st.sid, type:"boarding", month:r.month, year:r.year, amount:Number(r.amount)||0, status:r.status||"বাকি"
      });
    });

    commits.push(batch.commit());
    await Promise.all(commits);
    const nowIso = new Date().toISOString();
    setLastSyncedAt(nowIso);
    if(statusEl) statusEl.innerHTML = `<span style="color:var(--paid);">✔ সফলভাবে সিঙ্ক হয়েছে।</span>`;
    renderContent();
  }catch(err){
    console.error(err);
    if(statusEl) statusEl.innerHTML = `<span style="color:var(--due);">সিঙ্ক করতে সমস্যা হয়েছে: ${esc(err.message||String(err))}</span>`;
  }
}

/* ============================ ফর্ম হ্যান্ডলিং ============================ */
function handleFormSubmit(type, fd, form, photoDataUrl){
  if(type.startsWith("ledger:")){
    const tab = type.split(":")[1];
    const cfg = LEDGER_CONFIGS[tab];
    const amount = fd.get("amount");
    if(!amount) return;
    db[cfg.key].unshift({
      id:uid(), no:fd.get("no")||"", date:fd.get("date")||todayISO(),
      party:fd.get("party")||"", extra:fd.get("extra")||"", desc:fd.get("desc")||"", amount
    });
    saveDB(); renderContent(); return;
  }
  if(type==="students"){
    if(!fd.get("name")) return;
    if(editingStudentId){
      const s = db.students.find(x=>x.id===editingStudentId);
      if(s){
        s.admissionNo = fd.get("admissionNo")||"";
        s.name = fd.get("name");
        s.fatherName = fd.get("fatherName")||"";
        s.dob = fd.get("dob")||"";
        s.className = fd.get("className");
        s.address = fd.get("address")||"";
        s.mobile = fd.get("mobile")||"";
        s.date = fd.get("date")||s.date;
        s.feeQuota = fd.get("feeQuota")||"";
        s.boardingQuota = fd.get("boardingQuota")||"";
        if(photoDataUrl) s.photo = photoDataUrl;
      }
      editingStudentId = null;
      saveDB(); renderContent();
      alert("ছাত্রের তথ্য হালনাগাদ করা হয়েছে।");
      return;
    }
    const admDate = fd.get("date")||todayISO();
    const newSid = generateStudentId(admDate);
    db.students.unshift({
      id:uid(), sid:newSid, admissionNo:fd.get("admissionNo")||"", name:fd.get("name"),
      fatherName:fd.get("fatherName")||"", dob:fd.get("dob")||"", className:fd.get("className"),
      address:fd.get("address")||"", mobile:fd.get("mobile")||"", date:admDate,
      feeQuota:fd.get("feeQuota")||"", boardingQuota:fd.get("boardingQuota")||"",
      photo: photoDataUrl || ""
    });
    saveDB(); renderContent();
    alert("ছাত্র ভর্তি সম্পন্ন হয়েছে। ছাত্র আইডি নং: " + newSid);
    return;
  }
  if(type.startsWith("billing:")){
    const tab = type.split(":")[1];
    const cfg = BILLING_CONFIGS[tab];
    if(!fd.get("studentId")){ alert("অনুসন্ধান বক্স থেকে তালিকা থেকে একজন ছাত্র বেছে নিন।"); return; }
    if(!fd.get("amount")) return;
    db[cfg.key].unshift({
      id:uid(), studentId:fd.get("studentId"), month:fd.get("month"), year:fd.get("year"),
      amount:fd.get("amount"), status:fd.get("status")||"বাকি",
      payDate: fd.get("status")==="পরিশোধিত" ? todayISO() : ""
    });
    saveDB(); renderContent(); return;
  }
  if(type==="classRoutine"){
    if(!fd.get("subject")) return;
    db.classRoutine.unshift({ id:uid(), className:fd.get("className"), day:fd.get("day"), time:fd.get("time")||"", subject:fd.get("subject"), teacher:fd.get("teacher")||"" });
    saveDB(); renderContent(); return;
  }
  if(type==="examRoutine"){
    if(!fd.get("subject")) return;
    db.examRoutine.unshift({ id:uid(), examName:fd.get("examName")||"", className:fd.get("className"), subject:fd.get("subject"), date:fd.get("date")||todayISO(), time:fd.get("time")||"" });
    saveDB(); renderContent(); return;
  }
  if(type==="results"){
    if(!fd.get("studentId") || !fd.get("subject")) return;
    db.results.unshift({ id:uid(), studentId:fd.get("studentId"), examName:fd.get("examName")||"", subject:fd.get("subject"), fullMarks:fd.get("fullMarks")||"100", obtained:fd.get("obtained") });
    saveDB(); renderContent(); return;
  }
  if(type==="firebaseConfig"){
    saveFirebaseConfig({
      apiKey: fd.get("apiKey")||"", authDomain: fd.get("authDomain")||"", projectId: fd.get("projectId")||"",
      storageBucket: fd.get("storageBucket")||"", messagingSenderId: fd.get("messagingSenderId")||"", appId: fd.get("appId")||""
    });
    renderContent();
    alert("ফায়ারবেস তথ্য সংরক্ষণ করা হয়েছে। এখন 'এখনই সিঙ্ক করুন' চাপুন।");
    return;
  }
  if(type==="attendanceDaily"){
    const statusMap = {};
    studentsInClass(attendanceState.className).forEach(s=>{
      const val = fd.get("status-"+s.id);
      if(val) statusMap[s.id] = val;
    });
    saveDailyAttendance(attendanceState.date, attendanceState.className, statusMap);
    renderContent();
    alert("হাজিরা সংরক্ষণ করা হয়েছে।");
    return;
  }
  if(type==="boardingAttendanceDaily"){
    const statusMap = {};
    boardingStudentsList().forEach(s=>{
      const val = fd.get("bstatus-"+s.id);
      if(val) statusMap[s.id] = val;
    });
    saveBoardingDailyAttendance(boardingAttendanceState.date, statusMap);
    renderContent();
    alert("বোর্ডিং হাজিরা সংরক্ষণ করা হয়েছে।");
    return;
  }
  if(type==="libraryLoans"){
    if(!fd.get("bookName") || !fd.get("borrowerName")) return;
    db.libraryLoans.unshift({
      id:uid(), bookName:fd.get("bookName"), borrowerName:fd.get("borrowerName"),
      borrowerType:fd.get("borrowerType")||"ছাত্র", borrowDate:fd.get("borrowDate")||todayISO(),
      returnDate:"", status:"ফেরত দেওয়া হয়নি"
    });
    saveDB(); renderContent(); return;
  }
  if(type==="patronMembers"){
    if(!fd.get("name")) return;
    db.patronMembers.unshift({
      id:uid(), name:fd.get("name"), mobile:fd.get("mobile")||"", address:fd.get("address")||"",
      subType:fd.get("subType")||"মাসিক", amount:fd.get("amount")||"", joinDate:fd.get("joinDate")||todayISO()
    });
    saveDB(); renderContent(); return;
  }
  if(type==="patronPayments"){
    if(!fd.get("memberId") || !fd.get("amount")) return;
    db.patronPayments.unshift({
      id:uid(), memberId:fd.get("memberId"), month:fd.get("month"), year:fd.get("year"),
      amount:fd.get("amount"), status:fd.get("status")||"বাকি",
      payDate: fd.get("status")==="পরিশোধিত" ? todayISO() : ""
    });
    saveDB(); renderContent(); return;
  }
  if(type==="teachers"){
    if(!fd.get("name")) return;
    const joinDate = fd.get("joinDate") || todayISO();
    if(editingTeacherId){
      const t = db.teachers.find(x=>x.id===editingTeacherId);
      if(t){
        t.name = fd.get("name"); t.designation = fd.get("designation")||"";
        t.subject = fd.get("subject")||""; t.mobile = fd.get("mobile")||"";
        t.address = fd.get("address")||""; t.joinDate = joinDate;
        t.salaryScale = fd.get("salaryScale")||"";
      }
      editingTeacherId = null;
      saveDB(); renderContent();
      alert("শিক্ষকের তথ্য হালনাগাদ করা হয়েছে।");
      return;
    }
    const newTid = generateTeacherId(joinDate);
    db.teachers.unshift({
      id:uid(), tid:newTid, name:fd.get("name"), designation:fd.get("designation")||"",
      subject:fd.get("subject")||"", mobile:fd.get("mobile")||"", address:fd.get("address")||"",
      joinDate, salaryScale:fd.get("salaryScale")||""
    });
    saveDB(); renderContent();
    alert("শিক্ষক যোগ করা হয়েছে। শিক্ষক আইডি নং: " + newTid);
    return;
  }
  if(type==="teacherAssignments"){
    if(!fd.get("teacherId") || !fd.get("subject")) return;
    db.teacherAssignments.unshift({
      id:uid(), teacherId:fd.get("teacherId"), className:fd.get("className"), subject:fd.get("subject")
    });
    saveDB(); renderContent(); return;
  }
  if(type==="teacherAttendanceDaily"){
    const statusMap = {};
    db.teachers.forEach(t=>{
      const val = fd.get("tstatus-"+t.id);
      if(val) statusMap[t.id] = val;
    });
    saveTeacherDailyAttendance(teacherAttendanceState.date, statusMap);
    renderContent();
    alert("শিক্ষকদের হাজিরা সংরক্ষণ করা হয়েছে।");
    return;
  }
  if(type==="teacherSalary"){
    if(!fd.get("teacherId") || !fd.get("amount")) return;
    db.teacherSalaries.unshift({
      id:uid(), teacherId:fd.get("teacherId"), month:fd.get("month"), year:fd.get("year"),
      amount:fd.get("amount"), status:fd.get("status")||"বাকি",
      payDate: fd.get("status")==="পরিশোধিত" ? todayISO() : ""
    });
    saveDB(); renderContent(); return;
  }
}

function copyMessageToClipboard(msg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(msg).then(
      ()=>alert("মেসেজ কপি হয়েছে — এখন SMS বা WhatsApp-এ পেস্ট করে অভিভাবককে পাঠাতে পারবেন:\n\n"+msg),
      ()=>alert("কপি করা যায়নি। মেসেজটি নিজে কপি করুন:\n\n"+msg)
    );
  } else {
    alert("মেসেজটি কপি করে পাঠান:\n\n"+msg);
  }
}

function printSingleReceipt(kind, id){
  let heading, no, dateStr, payer, desc, amount, extraLine = "";
  if(kind === "income"){
    const r = db.incomeReceipts.find(x=>x.id===id); if(!r) return;
    heading = "রশিদ"; no = r.no; dateStr = r.date; payer = r.party; desc = r.desc; amount = r.amount;
  } else if(kind === "expense"){
    const r = db.expenseVouchers.find(x=>x.id===id); if(!r) return;
    heading = "ভাউচার"; no = r.no; dateStr = r.date; payer = r.party; desc = r.desc; amount = r.amount;
  } else if(kind === "fees" || kind === "boardingBills"){
    const cfg = BILLING_CONFIGS[kind];
    const r = db[cfg.key].find(x=>x.id===id); if(!r) return;
    const st = studentMap()[r.studentId];
    heading = "রশিদ"; no = "-"; dateStr = r.payDate || todayISO();
    payer = st ? `${st.name} (আইডি: ${st.sid||"-"}, শ্রেণি: ${st.className})` : "অজানা";
    desc = cfg.title + " — " + r.month + " " + bn(r.year);
    amount = r.amount; extraLine = r.status;
  } else if(kind === "teacherSalary"){
    const r = db.teacherSalaries.find(x=>x.id===id); if(!r) return;
    const t = teacherMap()[r.teacherId];
    heading = "বেতনের রশিদ"; no = "-"; dateStr = r.payDate || todayISO();
    payer = t ? `${t.name} (আইডি: ${t.tid||"-"}, ${t.designation||"শিক্ষক"})` : "অজানা";
    desc = "মাসিক বেতন — " + r.month + " " + bn(r.year);
    amount = r.amount; extraLine = r.status;
  } else return;

  const html = `<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><title>${esc(heading)}</title>
  <style>
    body{font-family:'Noto Sans Bengali','Nirmala UI',Arial,sans-serif;color:#22281F;padding:30px 40px;}
    .lh{text-align:center;border-bottom:3px solid #14432A;padding-bottom:14px;margin-bottom:24px;}
    .lh img{width:56px;height:56px;object-fit:contain;display:block;margin:0 auto 6px;}
    .lh h1{margin:0;font-size:20px;color:#14432A;} .lh p{margin:4px 0 0;color:#5B6357;font-size:12.5px;}
    .doc-title{text-align:center;font-size:17px;font-weight:700;margin-bottom:22px;text-decoration:underline;}
    .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #ccc;font-size:14px;}
    .row span:first-child{color:#5B6357;}
    .amount-box{margin-top:18px;text-align:center;font-size:20px;font-weight:700;color:#14432A;border:2px solid #14432A;border-radius:10px;padding:12px;}
    .sig{display:flex;justify-content:space-between;margin-top:70px;font-size:13px;}
    .sig div{border-top:1px solid #333;padding-top:6px;width:170px;text-align:center;}
    @media print{ body{padding:14mm 16mm;} }
  </style></head><body>
    <div class="lh"><img src="${LOGO_DATA_URI}" alt="লোগো"><h1>${esc(LETTERHEAD_TITLE)}</h1><p>${esc(LETTERHEAD_SUB)}</p></div>
    <div class="doc-title">${esc(heading)}</div>
    <div class="row"><span>নং</span><span>${esc(no||"-")}</span></div>
    <div class="row"><span>তারিখ</span><span>${fmtDate(dateStr)}</span></div>
    <div class="row"><span>${kind==="expense"?"গ্রহীতার নাম":"প্রাপক/প্রদানকারীর নাম"}</span><span>${esc(payer||"-")}</span></div>
    <div class="row"><span>বিবরণ</span><span>${esc(desc||"-")}</span></div>
    ${extraLine ? `<div class="row"><span>অবস্থা</span><span>${esc(extraLine)}</span></div>` : ""}
    <div class="amount-box">টাকার পরিমাণ: ${taka(amount)}</div>
    <div class="sig"><div>প্রাপক/আদায়কারীর স্বাক্ষর</div><div>অধ্যক্ষের স্বাক্ষর</div></div>
  </body></html>`;
  const win = window.open("", "_blank");
  if(!win){ alert("প্রিন্ট উইন্ডো খোলা যায়নি — পপ-আপ ব্লক করা থাকলে অনুমতি দিন।"); return; }
  win.document.write(html);
  win.document.close();
  win.focus();
  setTimeout(()=>{ win.print(); }, 350);
}

function printIdCards(){
  if(!db.students.length){ alert("কোনো ছাত্র নেই।"); return; }
  const cardHTML = db.students.map(s => `
    <div class="idcard">
      <img src="${LOGO_DATA_URI}" alt="লোগো" class="idcard-logo">
      <div class="idcard-head">${esc(LETTERHEAD_TITLE)}</div>
      <div class="idcard-sub">${esc(LETTERHEAD_SUB)}</div>
      <div class="idcard-body">
        <div class="idcard-photo">${s.photo?`<img src="${s.photo}">`:"👤"}</div>
        <div class="idcard-info">
          <div class="idcard-name">${esc(s.name)}</div>
          <div>পিতা: ${esc(s.fatherName||"-")}</div>
          <div>শ্রেণি: ${esc(s.className)}</div>
          <div>আইডি: ${esc(s.sid||"-")}</div>
          <div>মোবাইল: ${esc(s.mobile||"-")}</div>
          <div>জন্মতারিখ: ${s.dob?fmtDate(s.dob):"-"}</div>
          <div>ভর্তির তারিখ: ${s.date?fmtDate(s.date):"-"}</div>
        </div>
      </div>
    </div>`).join("");
  const html = `<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><title>আইডি কার্ড</title>
  <style>
    body{font-family:'Noto Sans Bengali','Nirmala UI',Arial,sans-serif;margin:0;padding:14px;}
    .grid{display:flex;flex-wrap:wrap;gap:10px;}
    .idcard{width:300px;border:2px solid #14432A;border-radius:12px;padding:10px 12px;text-align:center;page-break-inside:avoid;}
    .idcard-logo{width:36px;height:36px;object-fit:contain;margin-bottom:2px;}
    .idcard-head{font-weight:700;color:#14432A;font-size:13px;line-height:1.3;}
    .idcard-sub{font-size:10.5px;color:#5B6357;margin-bottom:8px;}
    .idcard-body{display:flex;gap:10px;align-items:center;text-align:left;}
    .idcard-photo{width:64px;height:64px;flex-shrink:0;border:1px solid #ccc;border-radius:8px;overflow:hidden;
      display:flex;align-items:center;justify-content:center;font-size:28px;background:#EEF2E8;}
    .idcard-photo img{width:100%;height:100%;object-fit:cover;}
    .idcard-info{font-size:12px;line-height:1.5;flex:1;}
    .idcard-name{font-weight:700;font-size:13.5px;color:#14432A;}
    @media print{ body{padding:6mm;} }
  </style></head><body><div class="grid">${cardHTML}</div></body></html>`;
  const win = window.open("", "_blank");
  if(!win){ alert("প্রিন্ট উইন্ডো খোলা যায়নি — পপ-আপ ব্লক করা থাকলে অনুমতি দিন।"); return; }
  win.document.write(html);
  win.document.close();
  win.focus();
  setTimeout(()=>{ win.print(); }, 350);
}

function printAdmitCards(){
  const examName = miscState.admitExamName;
  if(!examName){ alert("প্রথমে একটি পরীক্ষার নাম নির্বাচন করুন।"); return; }
  let students = miscState.admitClassFilter === "all" ? db.students : db.students.filter(s=>s.className===miscState.admitClassFilter);
  if(!students.length){ alert("কোনো ছাত্র পাওয়া যায়নি।"); return; }
  const cardHTML = students.map(s=>{
    const subjectsForStudent = db.examRoutine.filter(r=>r.examName===examName && r.className===s.className);
    const subjRows = subjectsForStudent.length
      ? subjectsForStudent.map(r=>`<tr><td>${esc(r.subject)}</td><td>${fmtDate(r.date)}</td><td>${esc(r.time||"-")}</td></tr>`).join("")

function statusCode(status){
  if(status === "উপস্থিত") return `<span style="color:#3D7A4E;font-weight:900;font-size:13px;">✓</span>`;
  if(status === "অনুপস্থিত") return `<span style="color:#B3441E;font-weight:900;font-size:13px;">✗</span>`;
  if(status === "ছুটি") return `<span style="display:inline-block;width:11px;height:11px;background:#C89B3C;border-radius:2px;"></span>`;
  return "";
}
function attendanceMarkHTML(status){
  if(status === "উপস্থিত") return `<span style="color:var(--paid);font-weight:900;font-size:14px;">✓</span>`;
  if(status === "অনুপস্থিত") return `<span style="color:var(--due);font-weight:900;font-size:14px;">✗</span>`;
  if(status === "ছুটি") return `<span style="display:inline-block;width:12px;height:12px;background:var(--gold);border-radius:2px;"></span>`;
  return "";
}
function attendanceSheetTableHTML(kind){
  let students, year, month, dataArr, idKey, personKey, idLabel;
  if(kind === "class"){
    students = attendanceState.reportClassFilter === "all" ? db.students : studentsInClass(attendanceState.reportClassFilter);
    year = attendanceState.reportYear; month = attendanceState.reportMonth;
    dataArr = db.attendance; idKey = "admissionNo"; personKey = "studentId"; idLabel = "ভর্তি নং";
  } else if(kind === "teacher"){
    students = db.teachers;
    year = teacherAttendanceState.reportYear; month = teacherAttendanceState.reportMonth;
    dataArr = db.teacherAttendance; idKey = "tid"; personKey = "teacherId"; idLabel = "আইডি নং";
  } else {
    students = boardingAttendanceState.reportClassFilter === "all" ? boardingStudentsList() : boardingStudentsList().filter(s=>s.className===boardingAttendanceState.reportClassFilter);
    year = boardingAttendanceState.reportYear; month = boardingAttendanceState.reportMonth;
    dataArr = db.boardingAttendance; idKey = "admissionNo"; personKey = "studentId"; idLabel = "ভর্তি নং";
  }
  if(!students.length) return `<div class="empty">কোনো তথ্য পাওয়া যায়নি।</div>`;
  const nDays = daysInMonth(year, month);
  const personLabel = kind === "teacher" ? "শিক্ষক" : "ছাত্র";

  const cell = 'border:1px solid #999;padding:4px 6px;text-align:center;';
  const head = cell + 'background:var(--sage);font-weight:700;white-space:nowrap;';

  const dayHeaders = Array.from({length:nDays}, (_,i)=>`<th style="${head}">${bn(i+1)}</th>`).join("");

  const dayPresentTotals = new Array(nDays).fill(0);
  const dayAbsentTotals = new Array(nDays).fill(0);

  const bodyRows = students.map((s,idx)=>{
    let cells = "";
    let present = 0, absent = 0;
    for(let d=1; d<=nDays; d++){
      const dateStr = year+"-"+String(month).padStart(2,"0")+"-"+String(d).padStart(2,"0");
      const rec = dataArr.find(a=>a[personKey]===s.id && a.date===dateStr);
      if(rec){
        if(rec.status==="উপস্থিত"){ present++; dayPresentTotals[d-1]++; }
        else if(rec.status==="অনুপস্থিত"){ absent++; dayAbsentTotals[d-1]++; }
      }
      cells += `<td style="${cell}">${rec?attendanceMarkHTML(rec.status):""}</td>`;
    }
    return `<tr>
      <td style="${cell}">${bn(idx+1)}</td>
      <td style="${cell}text-align:left;white-space:nowrap;">${esc(s.name)}</td>
      <td style="${cell}">${esc(s[idKey]||"-")}</td>
      ${cells}
      <td style="${cell}font-weight:700;color:var(--paid);">${bn(present)}</td>
      <td style="${cell}font-weight:700;color:var(--due);">${bn(absent)}</td>
    </tr>`;
  }).join("");

  const dayPresentFooter = dayPresentTotals.map(p=>`<td style="${cell}font-weight:700;">${bn(p)}</td>`).join("");
  const dayAbsentFooter = dayAbsentTotals.map(a=>`<td style="${cell}font-weight:700;">${bn(a)}</td>`).join("");

  return `<div style="overflow-x:auto;">
    <table style="font-size:12px;border-collapse:collapse;">
      <thead><tr>
        <th style="${head}">ক্রমিক</th>
        <th style="${head}">${personLabel==="শিক্ষক"?"শিক্ষকের নাম":"ছাত্র/ছাত্রীর নাম"}</th>
        <th style="${head}">${idLabel}</th>
        ${dayHeaders}
        <th style="${head}">উপস্থিত</th>
        <th style="${head}">অনুপস্থিত</th>
      </tr></thead>
      <tbody>
        ${bodyRows}
        <tr>
          <td style="${cell}font-weight:700;text-align:right;" colspan="3">উপস্থিত ${personLabel} সংখ্যা</td>
          ${dayPresentFooter}
          <td style="${cell}" colspan="2"></td>
        </tr>
        <tr>
          <td style="${cell}font-weight:700;text-align:right;" colspan="3">অনুপস্থিত ${personLabel} সংখ্যা</td>
          ${dayAbsentFooter}
          <td style="${cell}" colspan="2"></td>
        </tr>
        <tr>
          <td style="${cell}font-weight:700;text-align:right;" colspan="${3+nDays}">মোট ${personLabel} সংখ্যা</td>
          <td style="${cell}font-weight:700;" colspan="2">${bn(students.length)}</td>
        </tr>
      </tbody>
    </table>
  </div>
    <div style="margin-top:10px;font-size:12.5px;color:var(--inkSoft);display:flex;gap:16px;flex-wrap:wrap;align-items:center;">
      <span><span style="color:var(--paid);font-weight:900;">✓</span> উপস্থিত</span>
      <span><span style="color:var(--due);font-weight:900;">✗</span> অনুপস্থিত</span>
      <span><span style="display:inline-block;width:12px;height:12px;background:var(--gold);border-radius:2px;vertical-align:middle;"></span> ছুটি</span>
    </div>`;
}

function printCurrentTab(tab){

    title = cfg.title;
    columns = ledgerColumns(cfg).map(c=>({label:c.label, get:c.get}));
    rows = filteredRows(tab, cfg);
    const total = rows.reduce((s,i)=>s+Number(i.amount||0),0);

/* ============================ ব্যাকআপ এক্সপোর্ট/ইমপোর্ট ============================ */
async function exportData(){
  const filename = "madrasa-backup-" + todayISO() + ".json";
  const blob = new Blob([JSON.stringify(db, null, 2)], {type:"application/json"});

  try{
    const file = new File([blob], filename, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({
        files:[file],
        title:"মাদরাসা ব্যাকআপ",
        text:"মাদরাসা সফটওয়্যারের ব্যাকআপ ফাইল — Google Drive, OneDrive বা অন্য যেকোনো জায়গায় সংরক্ষণ করুন।"
      });
      return;
    }
  }catch(e){
    if(e && e.name === "AbortError") return;
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function handleImportFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      if(!confirm("ব্যাকআপ ফাইল থেকে ডেটা লোড করলে বর্তমান সব তথ্য প্রতিস্থাপিত হবে। আপনি কি নিশ্চিত?")) return;
      db = Object.assign(defaultDB(), parsed);
      saveDB();
      renderContent();
      alert("ব্যাকআপ সফলভাবে লোড হয়েছে।");
    }catch(err){
      alert("ফাইলটি সঠিক ব্যাকআপ ফরম্যাটে নেই।");
    }
  };
  reader.readAsText(file);
}

    const [ctx, delta] = calNav.dataset.calNav.split(":");
    const st = getAttContext(ctx);
    let m = st.calendarMonth + Number(delta);
    let y = st.calendarYear;
    if(m < 1){ m = 12; y -= 1; } else if(m > 12){ m = 1; y += 1; }
    st.calendarMonth = m; st.calendarYear = y;
    renderContent();
    return;
  }
  const calPick = e.target.closest("[data-cal-pick]");
  if(calPick){
    const idx = calPick.dataset.calPick.indexOf(":");
    const ctx = calPick.dataset.calPick.slice(0, idx);
    const iso = calPick.dataset.calPick.slice(idx+1);
    const st = getAttContext(ctx);
    st.calendarOpen = false;
    setAttDate(ctx, iso);
    renderContent();
    return;
  }
  const dobToggle = e.target.closest("[data-dob-cal-toggle]");
  if(dobToggle){
    dobPickerState.open = !dobPickerState.open;
    if(dobPickerState.open){
      const dobInput = document.getElementById("dobInput");
      if(dobInput && dobInput.value){
        const [y,m] = dobInput.value.split("-");
        dobPickerState.year = Number(y); dobPickerState.month = Number(m);
      }
    }
    updateDobCalendarDOM();
    return;
  }
  const dobNav = e.target.closest("[data-dob-cal-nav]");
  if(dobNav){
    let m = dobPickerState.month + Number(dobNav.dataset.dobCalNav);
    let y = dobPickerState.year;
    if(m < 1){ m = 12; y -= 1; } else if(m > 12){ m = 1; y += 1; }
    dobPickerState.month = m; dobPickerState.year = y;
    updateDobCalendarDOM();
    return;
  }
  const dobPick = e.target.closest("[data-dob-cal-pick]");
  if(dobPick){
    const dobInput = document.getElementById("dobInput");
    if(dobInput) dobInput.value = dobPick.dataset.dobCalPick;
    dobPickerState.open = false;
    updateDobCalendarDOM();
    return;
  }
  const monthToggle = e.target.closest("[data-month-toggle]");
  if(monthToggle){
    const key = monthToggle.dataset.monthToggle;
    expandedMonth = expandedMonth===key ? null : key;
    renderContent();
    return;
  }
  if(e.target.closest("#menuBtn")){
    document.getElementById("sidebar").classList.toggle("open");
    document.getElementById("overlay").classList.toggle("show");
    return;
  }
  if(e.target.closest("#overlay")){
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("overlay").classList.remove("show");
    return;
  }
  if(e.target.closest("#exportBtn")){ exportData(); return; }
  if(e.target.closest("#importBtn")){ document.getElementById("importFile").click(); return; }

  if(e.target.closest("#lockBtn")){ showLockOverlay("unlock"); return; }
  if(e.target.closest("#changePinBtn")){ showLockOverlay("change"); return; }
  if(e.target.closest("#pinChangeCancel")){ hideLockOverlay(); return; }
  if(e.target.closest("#forgotPinLink")){ factoryResetForgotPin(); return; }
  if(e.target.closest("#guardianViewLink")){ showLockOverlay("guardian"); return; }
  if(e.target.closest("#guardianBackToLogin")){ showLockOverlay(getStoredPinHash() ? "unlock" : "set"); return; }
  if(e.target.closest("#guardianBack")){ currentGuardianStudent = null; showLockOverlay("guardian"); return; }

  const pickStudentBtn = e.target.closest("[data-pick-student]");
  if(pickStudentBtn){
    const idx = pickStudentBtn.dataset.pickStudent.indexOf(":");
    const tab = pickStudentBtn.dataset.pickStudent.slice(0, idx);
    const sid = pickStudentBtn.dataset.pickStudent.slice(idx+1);
    selectStudentForBilling(tab, sid);
    return;
  }
  const pickTeacherBtn = e.target.closest("[data-pick-teacher]");
  if(pickTeacherBtn){
    const idx = pickTeacherBtn.dataset.pickTeacher.indexOf(":");
    const tab = pickTeacherBtn.dataset.pickTeacher.slice(0, idx);
    const tid = pickTeacherBtn.dataset.pickTeacher.slice(idx+1);
    selectTeacherForSalary(tab, tid);
    return;
  }
  const pickMemberBtn = e.target.closest("[data-pick-member]");
  if(pickMemberBtn){
    const idx = pickMemberBtn.dataset.pickMember.indexOf(":");
    const tab = pickMemberBtn.dataset.pickMember.slice(0, idx);
    const mid = pickMemberBtn.dataset.pickMember.slice(idx+1);
    selectMemberForPayment(tab, mid);
    return;
  }
  if(!e.target.closest("[data-student-search]") && !e.target.closest("[data-teacher-search]") && !e.target.closest("[data-member-search]") && !e.target.closest(".student-suggest")){
    document.querySelectorAll(".student-suggest").forEach(b=>{ b.style.display = "none"; });
  }
});

function resizeImageToDataURL(file, maxSize){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxSize){ h = Math.round(h*maxSize/w); w = maxSize; } }
        else { if(h > maxSize){ w = Math.round(w*maxSize/h); h = maxSize; } }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.75));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.addEventListener("submit", function(e){
  const form = e.target.closest("form[data-form]");
  if(!form) return;
  e.preventDefault();
  const fd = new FormData(form);
  const type = form.dataset.form;
  if(type.startsWith("pin-")){ handlePinForm(type, fd); return; }
  if(type.startsWith("guardian-")){ handleGuardianForm(type, fd); return; }
  if(type === "students"){
    const file = fd.get("photo");
    if(file && file.size > 0){
      resizeImageToDataURL(file, 320).then(dataUrl => {
        handleFormSubmit(type, fd, form, dataUrl);
        form.reset();
      }).catch(() => {
        handleFormSubmit(type, fd, form, "");
        form.reset();
      });
    } else {
      handleFormSubmit(type, fd, form, "");
      form.reset();
    }
    return;
  }
  handleFormSubmit(type, fd, form);
  form.reset();
});

document.addEventListener("input", function(e){
  const studentSearchEl = e.target.closest("[data-student-search]");
  if(studentSearchEl){
    const tab = studentSearchEl.dataset.studentSearch;
    const hidden = document.getElementById("studentIdHidden-"+tab);
    if(hidden) hidden.value = "";
    renderStudentSuggestions(tab, studentSearchEl.value);
    return;
  }
  const teacherSearchEl = e.target.closest("[data-teacher-search]");
  if(teacherSearchEl){
    const tab = teacherSearchEl.dataset.teacherSearch;
    const hidden = document.getElementById("teacherIdHidden-"+tab);
    if(hidden) hidden.value = "";
    renderTeacherSuggestions(tab, teacherSearchEl.value);
    return;
  }
  const memberSearchEl = e.target.closest("[data-member-search]");
  if(memberSearchEl){
    const tab = memberSearchEl.dataset.memberSearch;
    const hidden = document.getElementById("memberIdHidden-"+tab);
    if(hidden) hidden.value = "";
    renderMemberSuggestions(tab, memberSearchEl.value);
    return;
  }
  const s = e.target.closest("[data-search]");
  if(s){
    searchState[s.dataset.search] = s.value;
    const tbl = document.getElementById("tbl-"+s.dataset.search);
    if(tbl){
      if(s.dataset.search==="students") tbl.innerHTML = studentsTableHTML();
      else if(BILLING_CONFIGS[s.dataset.search]) tbl.innerHTML = billingTableHTML(s.dataset.search);
      else if(s.dataset.search==="results") tbl.innerHTML = resultsTableHTML();
      else tbl.innerHTML = ledgerTableHTML(s.dataset.search);
    }
  }
});
document.addEventListener("focusin", function(e){
  const el = e.target.closest("[data-student-search]");
  if(el) renderStudentSuggestions(el.dataset.studentSearch, el.value);
  const tel = e.target.closest("[data-teacher-search]");
  if(tel) renderTeacherSuggestions(tel.dataset.teacherSearch, tel.value);
  const mel = e.target.closest("[data-member-search]");
  if(mel) renderMemberSuggestions(mel.dataset.memberSearch, mel.value);
});

document.addEventListener("change", function(e){
  if(e.target.type === "radio" && e.target.name && e.target.name.startsWith("status-")){
    updateLiveTally("status-", "attendanceLiveTally");
    return;
  }
  if(e.target.type === "radio" && e.target.name && e.target.name.startsWith("bstatus-")){
    updateLiveTally("bstatus-", "boardingAttendanceLiveTally");
    return;
  }
  const attField = e.target.closest("[data-attendance-field]");
  if(attField){
    attendanceState[attField.dataset.attendanceField] = attField.value;
    if(attField.dataset.attendanceField === "date"){
      const [y,m] = attField.value.split("-");
      attendanceState.calendarYear = Number(y); attendanceState.calendarMonth = Number(m);
    }
    renderContent();
    return;
  }
  const boardField = e.target.closest("[data-boarding-field]");
  if(boardField){
    boardingAttendanceState[boardField.dataset.boardingField] = boardField.value;
    if(boardField.dataset.boardingField === "date"){
      const [y,m] = boardField.value.split("-");
      boardingAttendanceState.calendarYear = Number(y); boardingAttendanceState.calendarMonth = Number(m);
    }
    renderContent();
    return;
  }
  const teachField = e.target.closest("[data-teacher-field]");
  if(teachField){
    teacherAttendanceState[teachField.dataset.teacherField] = teachField.value;
    if(teachField.dataset.teacherField === "date"){
      const [y,m] = teachField.value.split("-");
      teacherAttendanceState.calendarYear = Number(y); teacherAttendanceState.calendarMonth = Number(m);
    }
    renderContent();
    return;
  }
  const miscField = e.target.closest("[data-misc-field]");
  if(miscField){
    miscState[miscField.dataset.miscField] = miscField.value;
    renderContent();
    return;
  }
  const dobField = e.target.closest("[data-dob-cal-field]");
  if(dobField){
    dobPickerState[dobField.dataset.dobCalField] = Number(dobField.value);
    updateDobCalendarDOM();
    return;
  }
  const sel = e.target.closest("[data-autofill]");
  if(sel){
    const pool = sel.dataset.autofillSource === "teacher" ? db.teachers : db.students;
    const record = pool.find(x=>x.id===sel.value);
    const amtInput = document.getElementById(sel.dataset.autofill);
    if(record && amtInput){
      const field = sel.dataset.autofillField;
      if(record[field]) amtInput.value = record[field];
    }
    return;
  }
  const fileInput = e.target.closest("#importFile");
  if(fileInput){ handleImportFile(fileInput.files[0]); fileInput.value=""; }
});
